const normalizar = (s) => {
  if (!s) return '';
  return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[\s\-_.]/g, '');
};

const levenshtein = (a, b) => {
  const m = a.length, n = b.length;
  if (m === 0) return n; if (n === 0) return m;
  const dp = [];
  for (let i = 0; i <= m; i++) { dp.push(new Array(n+1).fill(0)); dp[i][0] = i; }
  for (let j = 0; j <= n; j++) dp[0][j] = j;
  for (let i = 1; i <= m; i++) {
    for (let j = 1; j <= n; j++) {
      const cost = a[i-1] === b[j-1] ? 0 : 1;
      dp[i][j] = Math.min(dp[i-1][j]+1, dp[i][j-1]+1, dp[i-1][j-1]+cost);
    }
  }
  return dp[m][n];
};

const buscarHistoriaRaca = (raca, especie) => {
  const key = normalizar(raca);
  const tipo = normalizar(especie);
  const ehGato = ['gato', 'gata', 'felino', 'felina'].includes(tipo);
  const ehCao = ['cao', 'cadela', 'cachorro', 'cachorra', 'canino', 'canina'].includes(tipo);
  const animal = ehGato ? 'gatos' : ehCao ? 'cães' : 'cães e gatos';
  const semRaca = ['srd', 'viralata', 'semracadefinida', 'semraca'].some(
    termo => key.includes(termo)
  );
  if (semRaca) {
    return 'SRD significa "Sem Raça Definida", também conhecido como vira-lata. A identificação se aplica a ' + animal + ' sem uma raça definida. Cada pet tem características e personalidade próprias.';
  }
  if (!key) return null;
  const racasGatos = ['persa', 'siamês', 'angorá'];
  const candidatas = Object.keys(RACAS_DB).filter(nome => {
    if (nome === 'srd' || nome === 'vira-lata') return false;
    if (ehGato) return racasGatos.includes(nome);
    if (ehCao) return !racasGatos.includes(nome);
    return true;
  });
  // Only exact breed matches: similar names can describe different breeds.
  const encontrada = candidatas.find(nome => normalizar(nome) === key);
  if (encontrada) return RACAS_DB[encontrada];
  return 'As informações de raça deste pet foram fornecidas pelo tutor. Ainda não há uma descrição específica para a raça cadastrada nesta certidão.';
};

const calcularStatusVacina = (dataAplicacao) => {
  if (!dataAplicacao) return { label: 'Sem data', pillBg: '#e5e7eb', pillText: '#374151' };
  const meses = (new Date() - new Date(dataAplicacao)) / (1000 * 60 * 60 * 24 * 30.44);
  if (meses <= 8) return { label: 'Em dia', pillBg: '#dcfce7', pillText: '#15803d' };
  if (meses <= 12) return { label: 'Atenção', pillBg: '#fef3c7', pillText: '#a16207' };
  return { label: 'Vencida', pillBg: '#fee2e2', pillText: '#b91c1c' };
};

  const submitLogin = async (e) => {
    e.preventDefault();
    setErro(''); setCarregando(true);
    try {
      if (modo === 'register') {
        if (!form.nome || !form.email || !form.senha) { setErro('Preencha todos os campos'); setCarregando(false); return; }
        if (form.pin && form.pin.length !== 4) { setErro('O PIN precisa ter 4 dígitos'); setCarregando(false); return; }
        const { data: existe } = await sb.from('tutores').select('id').eq('email', form.email).maybeSingle();
        if (existe) { setErro('E-mail já cadastrado'); setCarregando(false); return; }
        const novo = { id: Date.now(), nome: form.nome, email: form.email, senha: form.senha, pin: form.pin || null, cpf: null, telefone: null, whatsapp: null, endereco: null, bairro: null, cidade: null, uf: null, cep: null, notificar_leitura_qr: form.notificar_leitura_qr === true, notificar_pets_perdidos_regiao: form.notificar_pets_perdidos_regiao === true };
        const { data, error } = await sb.from('tutores').insert([novo]).select().single();
        if (error) { setErro('Erro ao cadastrar: ' + error.message); setCarregando(false); return; }
        onLogin(data);
      } else {
        const { data, error } = await sb.from('tutores').select('*').eq('email', form.email).eq('senha', form.senha).maybeSingle();
        if (error || !data) { setErro('E-mail ou senha incorretos'); setCarregando(false); return; }
        onLogin(data);
      }
    } catch (err) { setErro('Erro: ' + err.message); }
    setCarregando(false);
  };

            <>
              <h1 className="text-xl font-bold mb-1">Entrar na sua conta</h1>

const PinScreen = ({ user, onUnlock, onUsarSenha }) => {
  const [pin, setPin] = useState(['','','','']);
  const [erro, setErro] = useState('');
  const [tentativas, setTentativas] = useState(0);
  const inputsRef = [useRef(), useRef(), useRef(), useRef()];
  useEffect(() => { setTimeout(()=>inputsRef[0].current && inputsRef[0].current.focus(), 100); }, []);
  const handleChange = (idx, val) => {
    const v = val.replace(/\D/g,'').slice(-1);
    const novo = [...pin]; novo[idx] = v; setPin(novo);
    if (v && idx < 3) inputsRef[idx+1].current && inputsRef[idx+1].current.focus();
    if (novo.every(x => x !== '')) validar(novo.join(''));
  };
  const handleKeyDown = (idx, e) => { if (e.key === 'Backspace' && !pin[idx] && idx > 0) inputsRef[idx-1].current && inputsRef[idx-1].current.focus(); };
  const validar = (codigo) => {
    if (codigo === user.pin) { onUnlock(); }
    else {
      const t = tentativas + 1; setTentativas(t);
      setErro(t >= 3 ? 'PIN incorreto. Use a senha completa.' : 'PIN incorreto. Tente novamente.');
      setPin(['','','','']);
      setTimeout(()=>inputsRef[0].current && inputsRef[0].current.focus(), 100);
    }
  };
  return (
    <div className="min-h-screen flex items-center justify-center p-4" style={{backgroundColor:'#faf6ec'}}>
      <div className="w-full max-w-sm text-center">
        <div className="w-16 h-16 rounded-full flex items-center justify-center text-white text-3xl mx-auto mb-4" style={{backgroundColor:'#eab308'}}>🐾</div>
        <div className="font-bold text-lg mb-1">PetfiQ</div>
        <div className="text-sm text-gray-600 mb-1">Olá, {user.nome.split(' ')[0]}</div>
        <div className="text-xs text-gray-500 mb-6">Digite seu PIN de 4 dígitos</div>
        <div className="flex justify-center gap-3 mb-4">
          {[0,1,2,3].map(i => (
            <input key={i} ref={inputsRef[i]} type="tel" inputMode="numeric" maxLength="1" className={`pin-input ${pin[i] ? 'filled' : ''}`} value={pin[i]} onChange={e => handleChange(i, e.target.value)} onKeyDown={e => handleKeyDown(i, e)} />
          ))}
        </div>
        {erro && <div className="text-xs text-red-600 mb-3">{erro}</div>}
        <button onClick={onUsarSenha} className="text-xs text-gray-500 underline">Usar senha completa</button>
      </div>
    </div>
  );
};


const PainelPetsPerdidos = ({ pets, user, onRefresh }) => {
  const [filtro, setFiltro] = useState('regiao');
  const [busca, setBusca] = useState('');
  const [cidadeFiltro, setCidadeFiltro] = useState(user.cidade || '');
  const [bairroFiltro, setBairroFiltro] = useState('');
  const [ufFiltro, setUfFiltro] = useState((user.uf || '').toUpperCase());
  const [regiaoAplicada, setRegiaoAplicada] = useState({cidade:user.cidade || '',bairro:'',uf:(user.uf || '').toUpperCase()});
  const [aba, setAba] = useState('perdidos');
  const norm = v => String(v || '').trim().toLocaleLowerCase('pt-BR').normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  const compararRegiao = p => !!regiaoAplicada.cidade.trim() &&
    norm(p.cidade_desaparecimento) === norm(regiaoAplicada.cidade) &&
    (!regiaoAplicada.uf.trim() || norm(p.uf_desaparecimento)===norm(regiaoAplicada.uf)) &&
    (!regiaoAplicada.bairro.trim() || norm(p.bairro_desaparecimento).includes(norm(regiaoAplicada.bairro)));
  const buscarRegiao = e => {
    e.preventDefault();
    setRegiaoAplicada({cidade:cidadeFiltro.trim(),bairro:bairroFiltro.trim(),uf:ufFiltro.trim().toUpperCase()});
  };
  const perdidos = pets.filter(p => p.is_lost === true && p.public_id);
  const encontrados = pets.filter(p => p.is_lost !== true && !!p.reencontrado_em && p.public_id);
  const lista = (aba === 'perdidos' ? perdidos : encontrados)
    .filter(p => filtro === 'brasil' || compararRegiao(p))
    .filter(p => filtro !== 'brasil' || !busca || [p.nome,p.raca,p.bairro_desaparecimento,p.cidade_desaparecimento,p.uf_desaparecimento].some(v=>norm(v).includes(norm(busca))))
    .sort((a,b)=>new Date(b[aba==='perdidos'?'perdido_em':'reencontrado_em']||0)-new Date(a[aba==='perdidos'?'perdido_em':'reencontrado_em']||0));
  const atualizarLocal = async p => {
    if (String(p.tutor_id) !== String(user.id) || !p.is_lost) return;
    const bairro = window.prompt('Bairro onde o pet desapareceu (não informe endereço residencial):',p.bairro_desaparecimento||'');
    if (bairro === null) return;
    const cidade = window.prompt('Cidade onde o pet desapareceu:',p.cidade_desaparecimento||user.cidade||'');
    if (cidade === null) return;
    const uf = window.prompt('Sigla do estado:',p.uf_desaparecimento||user.uf||'SP');
    if (uf === null) return;
    if (!bairro.trim() || !cidade.trim() || !/^[A-Za-z]{2}$/.test(uf.trim())) {
      alert('Preencha bairro, cidade e sigla do estado para permitir a busca por região.');
      return;
    }
    const {error} = await sb.from('pets').update({
      bairro_desaparecimento:bairro.trim(),
      cidade_desaparecimento:cidade.trim(),
      uf_desaparecimento:uf.trim().toUpperCase()
    }).eq('id',p.id).eq('tutor_id',user.id);
    if (error) { alert('Não foi possível salvar a região: '+error.message); return; }
    if (onRefresh) await onRefresh();
  };
  const compartilhar = async p => {
    const url = 'https://rgpet.vercel.app/api/pet-share?pet='+encodeURIComponent(p.public_id);
    const titulo = p.is_lost ? 'Pet desaparecido: '+p.nome : p.nome+' voltou ao lar!';
    try {
      if (navigator.share) await navigator.share({title:titulo,text:titulo,url});
      else if (navigator.clipboard) { await navigator.clipboard.writeText(titulo+' '+url); alert('Link copiado!'); }
      else window.prompt('Copie o link para compartilhar:',url);
    } catch(err) { if (err.name !== 'AbortError') window.prompt('Copie o link:',url); }
  };
  return <main className="mobile-container p-4">
    <h1 className="text-xl font-bold mb-1" style={{color:'#1a3c2e'}}>🐾 Pets Perdidos e Voltou ao Lar</h1>
    <p className="text-xs text-gray-600 mb-4">Ajude a divulgar casos e celebre os reencontros. A localização exibida é apenas a região informada pelo tutor.</p>
    <div className="flex gap-2 mb-3">
      <button className="flex-1 rounded-xl py-3 text-sm font-bold" style={aba==='perdidos'?{background:'#a32121',color:'white'}:{background:'#fffdf5',color:'#1a3c2e',border:'1px solid #d3c29a'}} onClick={()=>setAba('perdidos')}>⚠ Perdidos ({perdidos.length})</button>
      <button className="flex-1 rounded-xl py-3 text-sm font-bold" style={aba==='reencontrados'?{background:'#167343',color:'white'}:{background:'#fffdf5',color:'#1a3c2e',border:'1px solid #d3c29a'}} onClick={()=>setAba('reencontrados')}>🏠 Voltou ao Lar ({encontrados.length})</button>
    </div>
    <div className="card space-y-3 mb-3">
      <div className="flex gap-2">
        <button className="flex-1 p-2 rounded-lg text-sm font-semibold" style={filtro==='regiao'?{background:'#1a3c2e',color:'white'}:{background:'#f5f1e6'}} onClick={()=>setFiltro('regiao')}>Minha cidade</button>
        <button className="flex-1 p-2 rounded-lg text-sm font-semibold" style={filtro==='brasil'?{background:'#1a3c2e',color:'white'}:{background:'#f5f1e6'}} onClick={()=>setFiltro('brasil')}>Todo o Brasil</button>
      </div>
      {filtro==='regiao' && <form className="space-y-3" onSubmit={buscarRegiao}>
        <div>
          <label className="label" htmlFor="petfiq-busca-cidade">Cidade</label>
          <input id="petfiq-busca-cidade" className="input-field" value={cidadeFiltro} onChange={e=>setCidadeFiltro(e.target.value)} placeholder="Ex.: São Paulo" required />
        </div>
        <div className="grid grid-cols-3 gap-2">
          <div className="col-span-2">
            <label className="label" htmlFor="petfiq-busca-bairro">Bairro (opcional)</label>
            <input id="petfiq-busca-bairro" className="input-field" value={bairroFiltro} onChange={e=>setBairroFiltro(e.target.value)} placeholder="Ex.: Jabaquara" />
          </div>
          <div>
            <label className="label" htmlFor="petfiq-busca-uf">UF</label>
            <input id="petfiq-busca-uf" className="input-field" maxLength="2" value={ufFiltro} onChange={e=>setUfFiltro(e.target.value.toUpperCase().replace(/[^A-Z]/g,'').slice(0,2))} placeholder="SP" />
          </div>
        </div>
        <button type="submit" disabled={!cidadeFiltro.trim()} className="btn-primary w-full py-3 rounded-xl text-sm font-bold" style={{opacity:cidadeFiltro.trim()?1:0.55}}>🔎 Buscar pets na região</button>
        <p className="text-xs text-gray-600">A busca mostra animais com local de desaparecimento cadastrado. O bairro restringe os resultados; deixe vazio para ver toda a cidade.</p>
      </form>}
      {filtro==='brasil' && <input className="input-field" value={busca} onChange={e=>setBusca(e.target.value)} placeholder="Pesquisar por nome, raça, bairro ou cidade"/>}
    </div>
    <div className="space-y-3">
      {!lista.length && <div className="card text-center text-sm text-gray-600">{filtro==='regiao' && !regiaoAplicada.cidade.trim() ? 'Digite sua cidade e toque em Buscar pets na região.' : filtro==='regiao' ? 'Não há casos cadastrados para '+[regiaoAplicada.bairro,regiaoAplicada.cidade,regiaoAplicada.uf].filter(Boolean).join(' · ')+'. Casos sem localização ficam em “Todo o Brasil”.' : 'Nenhum pet encontrado com esse termo.'}</div>}
      {lista.map(p=><article key={p.id} className="card" style={{border:'1px solid #d4bf84'}}>
        <div className="flex gap-3">
          <div className="w-24 h-24 flex-shrink-0 rounded-xl overflow-hidden" style={{background:'#f0e7d0'}}>
            {p.foto ? <img src={p.foto} alt={'Foto de '+p.nome} style={{width:'100%',height:'100%',objectFit:'cover'}}/> : <div className="w-full h-full flex items-center justify-center text-4xl">🐾</div>}
          </div>
          <div className="min-w-0 flex-1">
            <h2 className="font-bold text-lg" style={{color:'#1a3c2e'}}>{p.nome}</h2>
            <div className="text-xs text-gray-600">{p.especie || 'Pet'} · {p.raca || 'Raça não informada'}</div>
            <div className="text-xs mt-1">📍 {[p.bairro_desaparecimento,p.cidade_desaparecimento,p.uf_desaparecimento].filter(Boolean).join(' · ') || 'Região não informada'}</div>
            <div className="mt-2 text-xs font-semibold" style={{color:p.is_lost?'#a32121':'#167343'}}>{p.is_lost?'⚠ DESAPARECIDO':'🏠 VOLTOU AO LAR'}</div>
          </div>
        </div>
        <div className="flex gap-2 mt-3">
          <a href={'/?pet='+encodeURIComponent(p.public_id)} target="_blank" rel="noopener noreferrer" className="flex-1 py-2 text-center rounded-lg text-sm font-semibold" style={{background:'#1a3c2e',color:'white'}}>Ver identificação</a>
          <button className="flex-1 py-2 rounded-lg text-sm font-semibold" style={{border:'1px solid #b99945',color:'#1a3c2e'}} onClick={()=>compartilhar(p)}>Compartilhar</button>
        </div>
        {p.is_lost && String(p.tutor_id)===String(user.id) && <button onClick={()=>atualizarLocal(p)} className="w-full mt-2 py-2 rounded-lg text-sm font-semibold" style={{border:'1px dashed #b99945',color:'#1a3c2e'}}>📍 {p.cidade_desaparecimento?'Corrigir região do desaparecimento':'Informar região do desaparecimento'}</button>}
      </article>)}
    </div>
  </main>;
};

  const temCombo2 = (petId) => orders.some(o => o.pet_id===petId && o.tipo==='combo2' && o.status==='pago');
  return (
    <div className="mobile-container p-4">
      <h1 className="text-xl font-bold mb-1">Meus animais</h1>

      <div className="space-y-3">
        {petsDoUsuario.length === 0 && <div className="card text-center text-gray-500 text-sm">Nenhum pet cadastrado ainda.</div>}

            <div key={pet.id} className="card">
              <div className="flex items-center gap-3 cursor-pointer" onClick={()=>onOpenPet(pet)}>
                <div className="w-16 h-16 rounded-xl overflow-hidden bg-gray-100 flex-shrink-0">
                  {pet.foto ? <img src={pet.foto} style={{width:'100%',height:'100%',objectFit:'cover'}} /> : <div className="flex items-center justify-center" style={{width:'100%',height:'100%',fontSize:'24px',color:'#d1d5db'}}>🐾</div>}

                <div className="flex-1 min-w-0">
                  <div className="text-xs text-gray-400 mb-0.5">{pet.registro_id || 'CL-'+String(pet.id).slice(-6)}</div>
                  <div className="font-bold text-base truncate">{pet.nome}</div>
                  <div className="text-xs text-gray-500 truncate">{pet.raca||'—'} • {pet.porte||'—'} {pet.sexo?'• '+pet.sexo:''}</div>
                  <div className="flex gap-1 mt-1 flex-wrap">

                    {c2 && <span className="text-xs px-2 py-0.5 rounded-full bg-blue-100 text-blue-700">QR ✓</span>}

                <button onClick={(e)=>{e.stopPropagation();onEditPet(pet);}} className="flex-1 py-2 rounded-xl font-semibold text-sm" style={{backgroundColor:'#fffefb', color:'#1a3c2e', border:'1px solid #e8dfc8'}}>✏️ Editar</button>

// Calendar age: UTC civil dates avoid daylight-saving and date-only timezone shifts.
const calcularIdadePet = (nascimento, hoje = new Date()) => {
  const partes = /^(\d{4})-(\d{2})-(\d{2})$/.exec(nascimento || '');
  if (!partes) return null;
  const [, a, m, d] = partes.map(Number);
  const criar = (ano, mes, dia) => {
    const data = new Date(0);
    data.setUTCFullYear(ano, mes, dia);
    data.setUTCHours(0, 0, 0, 0);
    return data;
  };
  const inicio = criar(a, m - 1, d);
  const fim = criar(hoje.getFullYear(), hoje.getMonth(), hoje.getDate());
  if (a < 1 || inicio.getUTCFullYear() !== a || inicio.getUTCMonth() !== m - 1 ||
      inicio.getUTCDate() !== d || inicio > fim || !Number.isFinite(+fim)) return null;
  const aniversario = (ano, mes, dia) => {
    const ultimo = criar(ano, mes + 1, 0).getUTCDate();
    return criar(ano, mes, Math.min(dia, ultimo));
  };
  let anos = fim.getUTCFullYear() - a;
  if (aniversario(a + anos, m - 1, d) > fim) anos--;
  const base = aniversario(a + anos, m - 1, d);
  let meses = (fim.getUTCFullYear() - base.getUTCFullYear()) * 12 + fim.getUTCMonth() - base.getUTCMonth();
  const marco = n => aniversario(base.getUTCFullYear(), base.getUTCMonth() + n, base.getUTCDate());
  if (marco(meses) > fim) meses--;
  const dias = Math.round((fim - marco(meses)) / 86400000);
  return { anos, meses, dias };
};

const formatarIdadePet = idade => {
  const unidades = [[idade.anos, 'ano', 'anos'], [idade.meses, 'mês', 'meses'], [idade.dias, 'dia', 'dias']];
  const partes = unidades.filter(([n]) => n > 0).map(([n, singular, plural]) => n + ' ' + (n === 1 ? singular : plural));
  if (!partes.length) return '0 dias';
  return partes.length > 1 ? partes.slice(0, -1).join(', ') + ' e ' + partes[partes.length - 1] : partes[0];
};

const IdadePet = ({ pet }) => {
  const [hoje, setHoje] = useState(() => new Date());
  useEffect(() => {
    const atualizar = () => setHoje(new Date());
    const intervalo = setInterval(atualizar, 60000);
    window.addEventListener('focus', atualizar);
    window.addEventListener('beforeprint', atualizar);
    document.addEventListener('visibilitychange', atualizar);
    return () => {
      clearInterval(intervalo);
      window.removeEventListener('focus', atualizar);
      window.removeEventListener('beforeprint', atualizar);
      document.removeEventListener('visibilitychange', atualizar);
    };
  }, []);
  const idade = calcularIdadePet(pet.data_nascimento, hoje);
  const legado = String(pet.idade || '').trim();
  const anosLegados = /^(\d+)\s*anos?\b/i.exec(legado);
  const anos = idade ? idade.anos : anosLegados ? Number(anosLegados[1]) : null;
  return <React.Fragment>
    <span className="idade-pet-digital">{idade ? formatarIdadePet(idade) : legado || '—'}</span>
    <span className="idade-pet-impressa">{anos === null ? '—' : anos + (anos === 1 ? ' ano' : ' anos')}</span>
  </React.Fragment>;
};

const PetForm = ({ user, initialPet, onSaved, onCancel, codigoInicial }) => {
  const emEdicao = !!initialPet;
  const [form, setForm] = useState(initialPet ? {
    nome: initialPet.nome || '', raca: initialPet.raca || '', porte: initialPet.porte || '', idade: initialPet.idade || '',
    data_nascimento: initialPet.data_nascimento || '', foto: initialPet.foto || '', sexo: initialPet.sexo || 'Macho',
    castrado: initialPet.castrado || 'Não', peso: initialPet.peso || '', cor_pelagem: initialPet.cor_pelagem || '',
    local_nascimento: initialPet.local_nascimento || '', pai: initialPet.pai || '', mae: initialPet.mae || '',
    especie: initialPet.especie || '', microchip: initialPet.microchip || '', tem_microchip: initialPet.tem_microchip || false,
    codigo_pingente: initialPet.public_id || '',
    saude: initialPet.saude || { doencas:'', alergias:'', medicamentos:'', tipoSanguineo:'', comportamento:'Dócil', observacoes:'' },
    emergencia: initialPet.emergencia || { nome:'', telefone:'', relacao:'' }
  } : {
    nome:'', raca:'', porte:'', idade:'', data_nascimento:'', foto:'', sexo:'Macho', castrado:'Não', peso:'', cor_pelagem:'', local_nascimento:'', pai:'', mae:'', especie:'', microchip:'', tem_microchip:false,
    codigo_pingente: codigoInicial || '',
    saude: { doencas:'', alergias:'', medicamentos:'', tipoSanguineo:'', comportamento:'Dócil', observacoes:'' },
    emergencia: { nome:'', telefone:'', relacao:'' }
  });
  const [vacinas, setVacinas] = useState(initialPet?.vaccinations || []);
  const [novaVacina, setNovaVacina] = useState({ nome:'', data:'' });
  const [salvando, setSalvando] = useState(false);
  const [statusPerdido, setStatusPerdido] = useState(initialPet?.is_lost === true);
  const [alterandoStatus, setAlterandoStatus] = useState(false);
  const [localDesaparecimento, setLocalDesaparecimento] = useState({
    bairro:initialPet?.bairro_desaparecimento||'',
    cidade:initialPet?.cidade_desaparecimento||'',
    uf:initialPet?.uf_desaparecimento||''
  });

  const mudarStatusNoCadastro = async (perdido) => {
    if (salvando || alterandoStatus || statusPerdido === perdido) return;
    let local = localDesaparecimento;
    if (perdido) {
      const bairro = window.prompt('Bairro onde o pet desapareceu (sem endereço da residência):', local.bairro || user.bairro || '');
      if (bairro === null) return;
      const cidade = window.prompt('Cidade do desaparecimento:', local.cidade || user.cidade || '');
      if (cidade === null) return;
      const uf = window.prompt('Sigla do estado (ex.: SP):', local.uf || user.uf || '');
      if (uf === null) return;
      if (!bairro.trim() || !cidade.trim() || !/^[a-zA-Z]{2}$/.test(uf.trim())) {
        alert('Preencha bairro, cidade e sigla do estado para localizar o caso na região.');
        return;
      }
      local = {bairro:bairro.trim(),cidade:cidade.trim(),uf:uf.trim().toUpperCase()};
    }
    if (emEdicao) {
      const agora = new Date().toISOString();
      const alteracao = perdido
        ? {is_lost:true,perdido_em:agora,reencontrado_em:null,
            bairro_desaparecimento:local.bairro,cidade_desaparecimento:local.cidade,uf_desaparecimento:local.uf}
        : {is_lost:false,reencontrado_em:agora};
      setAlterandoStatus(true);
      const {error} = await sb.from('pets').update(alteracao).eq('id',initialPet.id).eq('tutor_id',user.id);

    const BloqueioDocumentos = ({ user, pet, orders, coupons, settings, onRefresh }) => {
  const [cupom, setCupom] = useState('');
  const [cupomAplicado, setCupomAplicado] = useState(null);
  const [mostrarCupom, setMostrarCupom] = useState(false);
  const [processando, setProcessando] = useState(false);
  const pedidosPet = orders.filter(o => o.pet_id === pet.id);
  const aplicarCupom = () => {
    const c = coupons.find(c => c.code.toLowerCase() === cupom.toLowerCase() && c.ativo);
    if (!c) { alert('Cupom inválido'); return; }
    setCupomAplicado(c); alert(`Cupom aplicado: ${c.desconto}% off!`);
  };
  const calcular = (base) => cupomAplicado ? +(base * (1 - cupomAplicado.desconto/100)).toFixed(2) : base;
  const comprar = async () => {
    if (!window.confirm('Você será direcionado ao site do Mercado Pago para concluir o pagamento.\n\nDeseja continuar?')) return;
    setProcessando(true);
    const base = settings.price_combo1;
    const valor = calcular(base);
    const orderId = Date.now();
    const pedido = { id: orderId, pet_id: pet.id, tutor_id: user.id, tipo: 'combo1', valor_base: base, valor: valor, status: 'pendente', metodo: settings.payment_mode === 'auto' ? 'automatico' : 'manual', cupom: cupomAplicado?.code || null };
    const { error: erroInsert } = await sb.from('pedidos').insert([pedido]);
    if (erroInsert) { alert('Erro ao registrar pedido: ' + erroInsert.message); setProcessando(false); return; }
    onRefresh();
    if (settings.payment_mode === 'auto') {
      try {
        const resp = await fetch('https://rgpet.vercel.app/api/create-payment', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ titulo: 'PetfiQ — Combo 1 (RG + Carteirinha + Certidão)', valor: valor, petId: pet.id, tipo: 'combo1', orderId: orderId, userEmail: user.email }) });
        const data = await resp.json();
        if (data.init_point) { window.location.href = data.init_point; }
        else { alert('Erro ao gerar pagamento: ' + (data.error || 'desconhecido')); setProcessando(false); }
      } catch (err) { alert('Erro de conexão: ' + err.message); setProcessando(false); }
    } else {
      alert(`Pedido registrado! Valor: R$ ${valor.toFixed(2)}. Envie o comprovante do Pix no WhatsApp para liberar.`);
      setCupom(''); setCupomAplicado(null); setMostrarCupom(false);
      setProcessando(false);
    }
  };
  return (
    <div className="space-y-3">
      <div className="card text-center">
        <div className="text-4xl mb-2">🔒</div>
        <div className="font-bold text-base mb-1" style={{color:'#1a3c2e'}}>Documentos bloqueados</div>
        <div className="text-xs text-gray-600 mb-4">Faça o pagamento para liberar o RG, a carteira de vacinação e a certidão de nascimento do seu pet.</div>
        <div className="p-3 rounded-xl mb-3 text-center" style={{backgroundColor:'#fef3c7', border:'1px solid #fde68a'}}>
          <div className="font-bold text-[11px]" style={{color:'#a16207'}}>⚠ ESTA É UMA PRÉVIA DO MODELO</div>
          <div className="text-[10px] mt-1" style={{color:'#a16207'}}>Os dados abaixo são fictícios. Após o pagamento, os dados reais do seu pet aparecerão.</div>
        </div>
      </div>
      <div className="card">
        <div className="font-semibold text-sm mb-3">Escolha um plano</div>
        <div className="border rounded-lg p-3 flex justify-between items-center mb-2">
          <div className="flex-1 min-w-0">
            <div className="font-semibold text-xs">Combo 1 — RG + Carteirinha + Certidão</div>
            <div className="text-[10px] text-gray-500">Documentos completos do seu pet</div>
          </div>
          <div className="text-right ml-2">
            <div className="font-bold text-sm">R$ {calcular(settings.price_combo1).toFixed(2)}</div>
          </div>
        </div>
<div className="text-xs rounded-xl p-3 mt-3" style={{background:'#f0fdf4',border:'1px solid #bbf7d0',color:'#166534'}}>
                  <strong>Pix no Mercado Pago:</strong> escolha Pix no checkout. Se aparecer um QR Code, você pode escaneá-lo com outro celular e uma conta bancária de outro titular. O código Pix Copia e Cola também pode estar disponível. Os documentos são liberados após a confirmação.
                </div>
        <button onClick={comprar} disabled={processando} className="btn-primary w-full py-3 rounded-xl font-semibold mt-2">
          {processando ? 'Aguarde...' : `💰 Comprar — R$ ${calcular(settings.price_combo1).toFixed(2)}`}
        </button>
        <button onClick={()=>setMostrarCupom(!mostrarCupom)} className="text-xs text-gray-600 underline mt-3 w-full text-center">{mostrarCupom ? 'Fechar cupom' : 'Tenho um cupom'}</button>
        {mostrarCupom && (
          <div className="flex gap-2 mt-2">
            <input className="input-field text-sm" placeholder="Cupom" value={cupom} onChange={e=>setCupom(e.target.value)} />

          </div>
        )}
        {cupomAplicado && <div className="text-xs text-green-700 mt-2 text-center">Cupom {cupomAplicado.code} ({cupomAplicado.desconto}% off)</div>}
      </div>
      {pedidosPet.length > 0 && (
        <div className="card">
          <div className="font-semibold text-sm mb-2">Seus pedidos</div>

            {pedidosPet.map(p => (
              <div key={p.id} className="flex justify-between items-center py-1 text-xs">

                  <div className="font-bold">R$ {Number(p.valor).toFixed(2)}</div>
                  <div className={p.status==='pago'?'text-green-700':'text-yellow-700'}>{p.status === 'pago' ? '✓ Pago' : '⏳ Pendente'}</div>
                </div>
              </div>
            ))}
          </div>
        </div>
      )}
      <div className="card">
        <div className="text-xs font-bold mb-2" style={{color:'#8b7a4d'}}>PRÉVIA DO MODELO</div>
        <RGDocumento pet={PET_FICTICIO} tutor={TUTOR_FICTICIO} />
      </div>
    </div>
  );
};

    setCupomAplicado(c); alert(`Cupom aplicado: ${c.desconto}% off!`);

  const calcular = (base) => cupomAplicado ? +(base * (1 - cupomAplicado.desconto/100)).toFixed(2) : base;

// Compartilhamento individual/coletivo com opção de copiar link em navegadores sem Share.
const compartilharPetfiQ = async (titulo, url, mensagem='') => {
  const texto = (mensagem || titulo) + '\n' + url;
  if (navigator.share) {
    try { await navigator.share({title:titulo,text:mensagem || titulo,url}); return 'compartilhado'; }
    catch (erro) { if (erro && erro.name === 'AbortError') return 'cancelado'; }
  }
  try { await navigator.clipboard.writeText(texto); return 'copiado'; }
  catch (erro) { window.prompt('Copie o link para compartilhar:',url); return 'manual'; }
};

const QRCodeFisicoModal = ({ pet, tutor, onClose, mostrarEndereco = true }) => {
  const [formato, setFormato] = useState('quadrado');
  const [tamanho, setTamanho] = useState('3');
  const publicUrl = `https://rgpet.vercel.app/?pet=${pet.public_id}`;
  const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=600x600&data=${encodeURIComponent(publicUrl)}`;
  const registroId = pet.registro_id || 'CL-'+String(pet.id).slice(-6);
  const tamanhoCm = parseFloat(tamanho);
  const [baixando, setBaixando] = useState(false);

  const previewPx = tamanhoCm === 2 ? 150 : tamanhoCm === 2.5 ? 170 : tamanhoCm === 3 ? 190 : tamanhoCm === 4 ? 230 : 270;

  const imprimir = () => {
    const win = window.open('', '_blank');
    if (!win) { alert('Permita pop-ups no seu navegador para imprimir.'); return; }
    const fontCodigo = tamanhoCm <= 2 ? '6pt' : tamanhoCm <= 2.5 ? '7pt' : tamanhoCm <= 3 ? '8pt' : tamanhoCm <= 4 ? '9pt' : '11pt';
    const alturaTotal = tamanhoCm + 0.4;
    const html = `<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>QR Code — ${pet.nome}</title>
<style>
  @page { margin: 1cm; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; background: #fff; padding: 20px; }
  .aviso { font-size: 11px; color: #666; margin-bottom: 20px; text-align: center; }
  .placa { display: flex; flex-direction: column; align-items: center; justify-content: center; background: #fff; border: 1.5px solid #333; }
  .placa.quadrado { width: ${tamanhoCm}cm; height: ${alturaTotal}cm; border-radius: 6px; padding: 0.12cm; }
  .placa.redondo { width: ${tamanhoCm}cm; height: ${tamanhoCm}cm; border-radius: 50%; padding: 8%; }
  .qr { width: 100%; aspect-ratio: 1 / 1; object-fit: contain; }
  .placa.redondo .qr { width: 88%; }
  .codigo { font-size: ${fontCodigo}; font-weight: 900; text-align: center; color: #cc0000; letter-spacing: 0.5px; padding-top: 0.05cm; white-space: nowrap; }
  .info { margin-top: 2cm; font-size: 12px; color: #333; text-align: center; line-height: 1.6; }
  .info b { color: #1a3c2e; }
  @media print {
    html, body { height: auto; min-height: 0; }
    body { display: block; padding: 0; }
    .placa { margin: 0 auto; break-inside: avoid; }
    .aviso, .info { break-inside: avoid; }
  }
</style></head>
<body>
  <div class="aviso">🖨️ Na janela de impressão, escolha tamanho real (100%) e corte na linha.<br/>Formato: ${formato} — ${tamanhoCm}cm.</div>
  <div class="placa ${formato}">
    <img class="qr" src="${qrUrl}" />
    <div class="codigo">${registroId}</div>
  </div>
  <div class="info">
    <div><b>Pet:</b> ${pet.nome}</div>
    <div><b>Tutor:</b> ${tutor?.nome || '—'}</div>
    <div><b>Registro:</b> ${registroId}</div>
  </div>
  <script>window.onload = function(){ setTimeout(function(){ window.print(); }, 700); }<\/script>
</body></html>`;
    win.document.write(html);
    win.document.close();
  };

  const baixarQR = async () => {
    setBaixando(true);
    try {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      await new Promise((resolve, reject) => { img.onload = resolve; img.onerror = reject; img.src = qrUrl; });
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');

      if (formato === 'quadrado') {
        const qrSize = 600;
        const codigoAlt = 100;
        canvas.width = qrSize;
        canvas.height = qrSize + codigoAlt;
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, qrSize, qrSize);
        ctx.fillStyle = '#cc0000';
        ctx.font = 'bold 46px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(registroId, qrSize/2, qrSize + codigoAlt/2);
      } else {
        const canvasSize = 800;
        canvas.width = canvasSize;
        canvas.height = canvasSize;
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvasSize, canvasSize);
        const centro = canvasSize / 2;
        
        const qrSize = canvasSize * 0.68; 
        const blocoTotalAltura = qrSize + 70;
        const qrY = centro - (blocoTotalAltura / 2);
        const textY = qrY + qrSize + 35;

        ctx.save();
        ctx.beginPath();
        ctx.arc(centro, centro, centro - 20, 0, Math.PI*2);
        ctx.clip();
        ctx.drawImage(img, (canvasSize - qrSize)/2, qrY, qrSize, qrSize);
        ctx.fillStyle = '#cc0000';
        
        const fontSize = Math.round(28 + (tamanhoCm - 2) * 6);
        ctx.font = `bold ${fontSize}px Arial`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(registroId, centro, textY);
        ctx.restore();
        ctx.strokeStyle = '#333333';
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.arc(centro, centro, centro - 20, 0, Math.PI*2);
        ctx.stroke();
      }

      const dataUrl = canvas.toDataURL('image/png');
      const a = document.createElement('a');
      a.href = dataUrl;
      a.download = `QR-${pet.nome.replace(/\s/g,'_')}-${formato}-${tamanho}cm.png`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    } catch (err) {
      window.open(qrUrl, '_blank');
    }
    setBaixando(false);
  };

  return (
    <div className="fixed top-0 left-0 right-0 bottom-0 z-50 overflow-y-auto p-4" style={{backgroundColor:'rgba(26,60,46,0.7)'}}>
      <div className="mobile-container">
        <div className="card">
          <div className="flex justify-between items-center mb-4">
            <div>
              <div className="font-bold text-base">{pet.nome}</div>
              <div className="text-xs text-gray-500">Registro: {registroId}</div>
              <div className="text-xs text-gray-500">Tutor: {tutor?.nome || '—'}</div>
            </div>
            <button onClick={onClose} className="w-8 h-8 rounded-full flex items-center justify-center text-gray-400 text-xl">✕</button>
          </div>
          <div className="label mb-1">Formato</div>
          <div className="flex gap-2 mb-3">
            <button onClick={()=>setFormato('quadrado')} className="flex-1 py-2 rounded-xl text-sm font-semibold" style={formato==='quadrado'?{backgroundColor:'#1a3c2e', color:'white'}:{backgroundColor:'#fffefb', color:'#6b7280', border:'1px solid #e8dfc8'}}>⬛ Quadrado</button>
            <button onClick={()=>setFormato('redondo')} className="flex-1 py-2 rounded-xl text-sm font-semibold" style={formato==='redondo'?{backgroundColor:'#1a3c2e', color:'white'}:{backgroundColor:'#fffefb', color:'#6b7280', border:'1px solid #e8dfc8'}}>⚫ Redondo</button>
          </div>
          <div className="label mb-1">Tamanho</div>
          <div className="flex gap-1 mb-4 flex-wrap">
            {['2','2.5','3','4','5'].map(t => (
              <button key={t} onClick={()=>setTamanho(t)} className="px-3 py-2 rounded-lg text-xs font-semibold" style={tamanho===t?{backgroundColor:'#1a3c2e', color:'white'}:{backgroundColor:'#fffefb', color:'#6b7280', border:'1px solid #e8dfc8'}}>{t} cm</button>
            ))}
          </div>
          <div className="py-6 mb-4 flex items-center justify-center" style={{backgroundColor:'#f5f5f5', borderRadius:'12px'}}>
            {formato === 'quadrado' ? (
              <div style={{width: previewPx + 'px', backgroundColor:'#fff', border:'1.5px solid #333', borderRadius:'10px', padding:'10px 10px 0 10px', boxShadow:'0 4px 16px rgba(0,0,0,0.1)'}}>
                <img src={qrUrl} style={{width:'100%', aspectRatio:'1', objectFit:'contain', display:'block'}} />
                <div style={{textAlign:'center', fontWeight:900, color:'#cc0000', fontSize:'11px', padding:'6px 0', letterSpacing:'0.5px'}}>{registroId}</div>
              </div>
            ) : (
              <div style={{width: previewPx + 'px', height: previewPx + 'px', backgroundColor:'#fff', border:'1.5px solid #333', borderRadius:'50%', display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', padding:'8%', boxSizing:'border-box', boxShadow:'0 4px 16px rgba(0,0,0,0.1)'}}>
                <img src={qrUrl} style={{width:'88%', aspectRatio:'1', objectFit:'contain', display:'block'}} />
                <div style={{textAlign:'center', fontWeight:900, color:'#cc0000', fontSize: Math.max(6, tamanhoCm * 3.5) + 'px', marginTop:'2px', letterSpacing:'0.3px', whiteSpace:'nowrap'}}>{registroId}</div>
              </div>
            )}
          </div>
          <div className="grid grid-cols-2 gap-2 mb-3">
            <button onClick={imprimir} className="btn-primary py-3 rounded-xl font-semibold text-sm">🖨️ Imprimir</button>
            <button onClick={baixarQR} disabled={baixando} className="py-3 rounded-xl font-semibold text-sm text-white" style={{backgroundColor:'#eab308'}}>{baixando ? 'Baixando...' : '⬇️ Baixar PNG'}</button>
          </div>
          <p className="text-[10px] text-gray-500 text-center leading-relaxed mb-4">Imprima no tamanho real ({tamanhoCm}cm), recorte e plastifique.<br/>O número embaixo do QR é o mesmo do RG do pet.</p>
          {mostrarEndereco && <div className="border-t pt-3">
            <div className="label mb-1">Endereço para envio</div>
            {tutor?.endereco || tutor?.cidade ? (
              <div className="text-xs leading-relaxed" style={{color:'#1a3c2e'}}>
                <div className="font-semibold">{tutor?.nome}</div>
                <div>{tutor?.endereco || '—'}</div>
                <div>{[tutor?.cidade, tutor?.uf].filter(Boolean).join(' - ')}{tutor?.cep ? ' · CEP ' + tutor.cep : ''}</div>
                {tutor?.telefone && <div className="mt-1">📞 {tutor.telefone}</div>}
              </div>
            ) : (
              <div className="text-xs text-gray-500">Tutor ainda não cadastrou o endereço.</div>
            )}
          </div>}
        </div>
      </div>
    </div>
  );
};

      alert('Informe o nome do produto e um preço válido.'); return;
    }
    const item = {
      id: 'item_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),
      nome:novoProduto.nome.trim().slice(0,100),
      tipo:novoProduto.tipo,
      preco:Math.round(valor*100)/100,
      observacao:novoProduto.observacao.trim().slice(0,280),
      ativo:true
    };
    await salvarProdutosExtras([...produtosExtras,item]);
    setNovoProduto({nome:'',tipo:'qr_fisico',preco:'',observacao:''});
  };
  const [tutores, setTutores] = useState([]);
  const [qrPetSel, setQrPetSel] = useState(null);
  const [buscaQR, setBuscaQR] = useState('');
  const [edicaoAdmin, setEdicaoAdmin] = useState(null);
  const [petVisualizando, setPetVisualizando] = useState(null);
  const [salvandoAdmin, setSalvandoAdmin] = useState(false);
  
  const [loteLetra, setLoteLetra] = useState('A');
  const [formatoFolha, setFormatoFolha] = useState('redondo');
  const [tamanhoFolha, setTamanhoFolha] = useState('3');
  const [quantidadeFolha, setQuantidadeFolha] = useState('70');

  useEffect(() => {
    (async () => {
      const { data } = await sb.from('tutores').select('*').order('id', { ascending: false });
      if (data) setTutores(data);
    })();
  }, [pets]);

  const toggleMode = async () => { await sb.from('configuracoes').update({ payment_mode: settings.payment_mode==='auto'?'manual':'auto' }).eq('id', 1); onRefresh(); };
  const salvarPrecos = async () => { await sb.from('configuracoes').update({ price_combo1: parseFloat(precos.c1), price_combo2: parseFloat(precos.c2) }).eq('id', 1); alert('Preços atualizados!'); onRefresh(); };
  const aprovarPedido = async (id) => { await sb.from('pedidos').update({ status: 'pago' }).eq('id', id); alert('Pedido aprovado!'); onRefresh(); };
  const criarCupom = async () => { if (!novoCupom.code) return; await sb.from('cupons').insert([{ code: novoCupom.code, desconto: novoCupom.desconto, ativo: true }]); setNovoCupom({ code:'', desconto: 100 }); onRefresh(); };
  const toggleCupom = async (code) => { const c = coupons.find(x => x.code === code); await sb.from('cupons').update({ ativo: !c.ativo }).eq('code', code); onRefresh(); };
  const atualizarStatusPetADM = async (pet, perdido) => {
    if (pet.is_lost === perdido) return;
    const agora = new Date().toISOString();
    const atualizacao = perdido
      ? { is_lost:true, perdido_em:agora, reencontrado_em:null }
      : { is_lost:false, reencontrado_em:agora };
    const {error} = await sb.from('pets').update(atualizacao).eq('id',pet.id);
    if (error) { alert('Não foi possível atualizar o status: '+error.message); return; }
    onRefresh();
  };

  // Alterações individuais: nunca executar exclusão em massa neste painel.
  const abrirEdicaoAdmin = (tipo, registro) => {
    setEdicaoAdmin({
      tipo, id: registro.id,
      nome: registro.nome || '',
      email: registro.email || '',
      telefone: registro.telefone || '',
      whatsapp: registro.whatsapp || '',
      raca: registro.raca || '',
      especie: registro.especie || ''
    });
  };

  const salvarEdicaoAdmin = async () => {
    if (!edicaoAdmin || salvandoAdmin) return;
    if (!edicaoAdmin.nome.trim()) { alert('Informe o nome.'); return; }
    setSalvandoAdmin(true);
    const tipo = edicaoAdmin.tipo;
    const campos = tipo === 'pet'
      ? { nome: edicaoAdmin.nome.trim(), raca: edicaoAdmin.raca.trim(), especie: edicaoAdmin.especie.trim() }
      : { nome: edicaoAdmin.nome.trim(), email: edicaoAdmin.email.trim().toLowerCase(), telefone: edicaoAdmin.telefone.trim(), whatsapp: edicaoAdmin.whatsapp.trim() };
    if (tipo === 'tutor' && !campos.email) { alert('Informe o e-mail.'); setSalvandoAdmin(false); return; }
    const tabela = tipo === 'pet' ? 'pets' : 'tutores';
    const { data, error } = await sb.from(tabela).update(campos).eq('id', edicaoAdmin.id).select('id');
    setSalvandoAdmin(false);
    if (error || !data || data.length !== 1) { alert('Não foi possível salvar. ' + (error?.message || 'Verifique as permissões do banco.')); return; }
    setEdicaoAdmin(null);
    onRefresh();
    alert('Cadastro atualizado.');
  };

  const excluirPedidoAdmin = async pedido => {
    if (!window.confirm('Excluir apenas o pedido ' + pedido.id + '? Esta ação não pode ser desfeita.')) return;
    const { data, error } = await sb.from('pedidos').delete().eq('id', pedido.id).select('id');
    if (error || !data || data.length !== 1) { alert('Não foi possível excluir: ' + (error?.message || 'Verifique as permissões.')); return; }
    onRefresh();
  };

  const excluirPetAdmin = async pet => {
    const vinculados = orders.filter(o => String(o.pet_id) === String(pet.id));
    if (vinculados.length) {
      alert('Este pet possui ' + vinculados.length + ' pedido(s) vinculado(s). Exclua primeiro os pedidos individuais na aba Pedidos para preservar o controle.');
      return;
    }
    const confirmacao = window.prompt('Para excluir definitivamente o pet ' + pet.nome + ', digite EXCLUIR:');
    if (confirmacao !== 'EXCLUIR') return;
    const { data, error } = await sb.from('pets').delete().eq('id', pet.id).select('id');
    if (error || !data || data.length !== 1) { alert('Não foi possível excluir: ' + (error?.message || 'Verifique as permissões.')); return; }
    onRefresh();
  };

  const excluirTutorAdmin = async tutor => {
    if (String(tutor.id) === String(user?.id)) { alert('A conta atualmente conectada não pode ser excluída por este painel.'); return; }
    const petsDoTutor = pets.filter(p => String(p.tutor_id) === String(tutor.id));
    const pedidosDoTutor = orders.filter(o => String(o.tutor_id) === String(tutor.id));
    if (petsDoTutor.length || pedidosDoTutor.length) {
      alert('Tutor com ' + petsDoTutor.length + ' pet(s) e ' + pedidosDoTutor.length + ' pedido(s). Exclua primeiro os registros vinculados.');
      return;
    }
    const confirmacao = window.prompt('Para excluir definitivamente o tutor ' + tutor.nome + ', digite EXCLUIR:');
    if (confirmacao !== 'EXCLUIR') return;
    const { data, error } = await sb.from('tutores').delete().eq('id', tutor.id).select('id');
    if (error || !data || data.length !== 1) { alert('Não foi possível excluir: ' + (error?.message || 'Verifique as permissões.')); return; }
    onRefresh();
  };

  const brlFinanceiro = valor => Number(valor || 0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
  const inicioDoDia = valor => new Date(valor.getFullYear(),valor.getMonth(),valor.getDate());
  const agoraFinanceiro = new Date();
  const inicioFinanceiro = inicioDoDia(agoraFinanceiro);
  if (periodoFinanceiro === 'semana') {
    const dia = (inicioFinanceiro.getDay()+6)%7;
    inicioFinanceiro.setDate(inicioFinanceiro.getDate()-dia);
  } else if (periodoFinanceiro === 'mes') inicioFinanceiro.setDate(1);
  const pedidosFinanceiros = orders.filter(o => {
    const dataPedido = o.criado_em ? new Date(o.criado_em) : new Date(Number(o.id));
    if (!Number.isFinite(dataPedido.getTime())) return false;
    if (periodoFinanceiro === 'personalizado') {

      if (dataFimFinanceiro && dataPedido >= new Date(dataFimFinanceiro+'T00:00:00').getTime()+86400000) return false;
      return true;
    }
    return dataPedido >= inicioFinanceiro && dataPedido <= agoraFinanceiro;
  });
  const pagosFinanceiros = pedidosFinanceiros.filter(o => o.status === 'pago');
  const pendentesFinanceiros = pedidosFinanceiros.filter(o => o.status === 'pendente');
  const recebidoFinanceiro = pagosFinanceiros.reduce((s,o)=>s+Number(o.valor||0),0);

    })].map(l=>l.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');
    const blob=new Blob(['\uFEFF'+texto],{type:'text/csv;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const link=document.createElement('a');link.href=url;link.download='rgpet-financeiro-'+new Date().toISOString().slice(0,10)+'.csv';link.click();

    if (filtroPedidos === 'todos') return true;

  const petsFiltrados = buscaQR.trim() ? pets.filter(p => {

    const isRedondo = formatoFolha === 'redondo';

<html><head><meta charset="UTF-8"><title>Folha de QR Codes - Lote ${loteLetra}</title>
<style>
  @page { margin: 5mm; } 
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; padding: 5px; background: #fff; }

    border-radius: ${isRedondo ? '50%' : '4px'}; 
    padding: ${isRedondo ? '8%' : '2px'};
  }
  .qr { width: 100%; aspect-ratio: 1 / 1; object-fit: contain; ${isRedondo ? 'width: 85%;' : ''} }
  .codigo { font-size: ${tamanhoCm <= 2 ? '6pt' : tamanhoCm <= 2.5 ? '7pt' : tamanhoCm <= 3 ? '8pt' : tamanhoCm <= 4 ? '9pt' : '11pt'}; font-weight: 900; text-align: center; color: #cc0000; letter-spacing: 0.5px; padding-top: 0.05cm; white-space: nowrap; margin-top: 2px; }
</style></head><body>`;
    
    for (let i = 1; i <= qtd; i++) {
      const code = `CL-${loteLetra}-${String(i).padStart(2, '0')}`;
      const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent('https://rgpet.vercel.app/?pet=' + code)}`;
      html += `<div class="item">
        <div class="placa">
          <img class="qr" src="${qrUrl}" />
          <div class="codigo">${code}</div>
        </div>
      </div>`;
    }

        return <div className="fixed top-0 left-0 right-0 bottom-0 z-50 overflow-y-auto" style={{background:'rgba(14,31,24,.78)'}} role="dialog" aria-modal="true" aria-label={'Ficha de '+pet.nome}>
          <div className="mobile-container p-3 sm:p-5 my-3">

                <button type="button" onClick={()=>setPetVisualizando(null)} aria-label="Fechar ficha" className="rounded-lg font-bold px-3 py-2 text-sm" style={{background:'#fff',color:'#173c2e'}}>✕ Fechar</button>

                  <div className="min-w-0 flex-1"><div className="font-bold text-lg" style={{color:'#173c2e'}}>{pet.nome}</div><div className="text-xs text-gray-600 break-all">{pet.registro_id||'Sem número de registro'}</div><div className="text-xs font-bold mt-2" style={{color:pet.is_lost?'#b91c1c':'#15803d'}}>{pet.is_lost?'⚠ PET PERDIDO':'✓ PET ENCONTRADO / EM CASA'}</div></div>
                  {pet.public_id && <a href={'https://rgpet.vercel.app/?pet='+encodeURIComponent(pet.public_id)} target="_blank" rel="noopener noreferrer" title="Abrir ficha pública de identificação" className="flex-shrink-0 text-center rounded-xl p-2" style={{background:'#fff',border:'1px solid #dec48c',color:'#173c2e',width:116}}>
                    <img width="96" height="96" loading="lazy" src={'https://api.qrserver.com/v1/create-qr-code/?size=192x192&margin=5&data='+encodeURIComponent('https://rgpet.vercel.app/?pet='+encodeURIComponent(pet.public_id))} alt={'QR Code público de '+pet.nome} style={{display:'block',maxWidth:'100%',height:'auto',margin:'0 auto'}}/>
                    <span style={{display:'block',fontSize:10,fontWeight:700,marginTop:4}}>QR DO PET ↗</span>
                  </a>}
                </div>
                <div className="grid grid-cols-2 gap-x-3">
                  <Campo nome="Espécie" valor={pet.especie}/><Campo nome="Raça" valor={pet.raca}/>
                  <Campo nome="Sexo" valor={pet.sexo}/><Campo nome="Porte" valor={pet.porte}/>
                  <Campo nome="Nascimento" valor={pet.data_nascimento}/><Campo nome="Peso" valor={pet.peso}/>
                  <Campo nome="Pelagem" valor={pet.cor_pelagem}/><Campo nome="Castrado" valor={pet.castrado}/>
                  <Campo nome="Microchip" valor={pet.microchip}/>
                  <Campo nome="Código do QR" valor={pet.public_id}/>
                </div>
                {pet.is_lost && <div className="rounded-xl p-3" style={{background:'#fff1f2',color:'#991b1b'}}><div className="text-xs font-bold">Local informado do desaparecimento</div><div className="text-sm">{[pet.bairro_desaparecimento,pet.cidade_desaparecimento,pet.uf_desaparecimento].filter(Boolean).join(' • ')||'Não informado'}</div></div>}
                <div className="rounded-xl p-3" style={{background:'#f6f0e3'}}>

                  <h3 className="text-sm font-bold" style={{color:'#173c2e'}}>Saúde e emergência</h3>

                  <Campo nome="Comportamento" valor={pet.saude?.comportamento}/>

};

const App = () => {
  const adminAppMode = (window.location.hostname === 'petfiq-adm.vercel.app' || window.location.hostname.startsWith('petfiq-adm-') || window.location.pathname === '/adm' || window.location.pathname.startsWith('/adm/') || new URLSearchParams(window.location.search).get('adm_app') === '1');
  const [user, setUser] = useState(null);
  const [view, setView] = useState(adminAppMode ? 'login' : 'landing');
  const [pets, setPets] = useState([]);
  const [orders, setOrders] = useState([]);
  const [coupons, setCoupons] = useState([]);
  const [settings, setSettings] = useState({ payment_mode: 'auto', price_combo1: 29.90, price_combo2: 10.00 });
  const [petSelecionado, setPetSelecionado] = useState(null);
  const [petEditando, setPetEditando] = useState(null);
  const [tabInicial, setTabInicial] = useState(null);
  const [publicId, setPublicId] = useState(null);
  const [isAdmin, setIsAdmin] = useState(false);
  const [registerMode, setRegisterMode] = useState(false);
  const [needPin, setNeedPin] = useState(false);
  const [pinUser, setPinUser] = useState(null);
  const [verPet, setVerPet] = useState(null);
  const [carregando, setCarregando] = useState(true);
  const [msgPagamento, setMsgPagamento] = useState(null);
  const [codigoInicial, setCodigoInicial] = useState(null);

  const carregarDados = async () => {
    const { data: petsData } = await sb.from('pets').select('*').order('id', { ascending: false });
    const { data: ordersData } = await sb.from('pedidos').select('*').order('id', { ascending: false });
    const { data: couponsData } = await sb.from('cupons').select('*');
    const { data: configData } = await sb.from('configuracoes').select('*').eq('id', 1).maybeSingle();
    if (petsData) setPets(petsData);
    if (ordersData) setOrders(ordersData);
    if (couponsData) setCoupons(couponsData);
    if (configData) setSettings(configData);
    setCarregando(false);
  };

  useEffect(() => {
    const params = new URLSearchParams(window.location.search);
    const p = params.get('pet');
    const pagamento = params.get('pagamento');
    const codigoParam = params.get('codigo');
    
    if (p && !pagamento) setPublicId(p);
    if (codigoParam) {
      setCodigoInicial(codigoParam);
    }
    if (params.get('admin') === '1' || adminAppMode) setIsAdmin(true);
    if (pagamento === 'sucesso') { setMsgPagamento({ tipo: 'sucesso', texto: 'Retorno do pagamento recebido. Aguarde a confirmação do Mercado Pago para liberar os documentos.' }); setTimeout(() => setMsgPagamento(null), 8000); }
    else if (pagamento === 'falha' || pagamento === 'pendente') { setMsgPagamento({ tipo: 'aviso', texto: 'O pagamento ainda não foi confirmado. Se você já pagou, aguarde alguns segundos.' }); setTimeout(() => setMsgPagamento(null), 8000); }
    
    carregarDados();
    const atualizarAoVoltar = () => { if (document.visibilityState === 'visible') carregarDados(); };
    document.addEventListener('visibilitychange', atualizarAoVoltar);
    if (adminAppMode) return; // O ADM independente sempre começa solicitando login.
    const saved = localStorage.getItem('rgpet_sessao');
    if (saved) {
      try {
        const s = JSON.parse(saved);
        sb.from('tutores').select('*').eq('id', s.userId).maybeSingle().then(({ data }) => {
          if (data) {
            if (data.pin) { setNeedPin(true); setPinUser(data); }
            else { 
              setUser(data); 
              setView(codigoParam ? 'newPet' : 'dashboard'); 
            }
          }
        });
      } catch {}
    } else {
      if (codigoParam) {
        setView('login');
        setRegisterMode(true);
      }
    }
  }, []);

  const handleLogin = (u) => {
    setUser(u);
    if (adminAppMode) { setView('admin'); return; } 
    localStorage.setItem('rgpet_sessao', JSON.stringify({ userId: u.id })); 
    if (codigoInicial) {
      setView('newPet');
    } else {
      setView('dashboard'); 
    }
  };

  const handleLogout = () => { setUser(null); setPetSelecionado(null); setView(adminAppMode ? 'login' : 'landing'); setNeedPin(false); setVerPet(null); setPetEditando(null); setCodigoInicial(null); localStorage.removeItem('rgpet_sessao'); };
  
  const handleUnlockPin = async () => {
    const saved = JSON.parse(localStorage.getItem('rgpet_sessao') || '{}');
    const { data } = await sb.from('tutores').select('*').eq('id', saved.userId).maybeSingle();
    if (data) { 
      setUser(data); 
      setView(codigoInicial ? 'newPet' : 'dashboard'); 
      setNeedPin(false); 
      setPinUser(null); 
    }
  };
  
  const handleUsarSenha = () => { localStorage.removeItem('rgpet_sessao'); setNeedPin(false); setUser(null); setPinUser(null); setView('login'); };

  if (new URLSearchParams(window.location.search).get('perdidos') === '1') return <MuralPublicoPerdidos />;
  if (publicId) return <PublicPetView publicId={publicId} />;
  if (adminAppMode) {
    if (!user) return <LoginScreen adminOnly={true} onLogin={handleLogin} initialRegister={false} onBackToLanding={()=>{}} />;
    return <div className="min-h-screen admin-app-content" style={{background:'#f8f0e4'}}>
      <header className="admin-app-header sticky top-0 z-40">
        <div className="mx-auto px-4 py-3 flex items-center justify-between gap-3" style={{maxWidth:1200}}>
          <div className="flex items-center gap-3">
            <img src="/petfiq-admin-icon.svg" width="40" height="40" alt="PetfiQ ADM"/>
            <div><div className="text-base font-bold">PetfiQ ADM</div><div className="text-xs" style={{color:'#e3c998'}}>Central Cão Leotta</div></div>
          </div>
          <button type="button" onClick={handleLogout} className="rounded-xl px-4 py-2 text-sm font-semibold" style={{color:'#422719',background:'#f9ead1'}}>Sair</button>
        </div>
      </header>
      <AdminPanel user={user} pets={pets} orders={orders} coupons={coupons} settings={settings} onRefresh={carregarDados}/>
    </div>;
  }
  if (needPin && !user && pinUser) return <PinScreen user={pinUser} onUnlock={handleUnlockPin} onUsarSenha={handleUsarSenha} />;
  if (!user) {
    if (view === 'landing') return <LandingPage onLoginClick={()=>{setRegisterMode(false);setView('login');}} onRegisterClick={()=>{setRegisterMode(true);setView('login');}} />;
    return <LoginScreen onLogin={handleLogin} initialRegister={registerMode} onBackToLanding={()=>setView('landing')} />;
  }

  return (
    <div className="min-h-screen" style={{backgroundColor:'#faf6ec'}}>
      <Navbar user={user} currentView={view} onNavigate={setView} onLogout={handleLogout} isAdmin={isAdmin} />
      {msgPagamento && (
        <div className="mobile-container px-4 pt-3">
          <div className="p-3 rounded-xl text-sm font-semibold text-center" style={{backgroundColor: msgPagamento.tipo==='sucesso'?'#dcfce7':'#fef3c7', color: msgPagamento.tipo==='sucesso'?'#15803d':'#a16207'}}>
            {msgPagamento.texto}
          </div>
        </div>
      )}
      {view === 'dashboard' && !petSelecionado && !petEditando && (
        <Dashboard user={user} pets={pets} orders={orders} onOpenPet={setPetSelecionado} onNewPet={()=>setView('newPet')} onVerPet={setVerPet} onEditPet={setPetEditando} carregando={carregando} />
      )}
      {view === 'newPet' && (
        <PetForm user={user} codigoInicial={codigoInicial} onSaved={(p)=>{ 
          carregarDados(); 
          const isFromQR = !!codigoInicial;
          setCodigoInicial(null);
          setPetSelecionado(p); 
          if (isFromQR) {
            setView('profile'); 
          } else {
            setView('dashboard'); 
          }
        }} onCancel={()=>{setCodigoInicial(null);setView('dashboard');}} />
      )}
      {petEditando && (
        <PetForm user={user} initialPet={petEditando} onSaved={(p)=>{ carregarDados(); setPetEditando(null); setView('dashboard'); }} onCancel={()=>setPetEditando(null)} />
      )}
      {view === 'dashboard' && petSelecionado && !petEditando && (
        <PetDetail user={user} pet={pets.find(p=>p.id===petSelecionado.id)||petSelecionado} orders={orders} coupons={coupons} settings={settings} onRefresh={carregarDados} onBack={()=>{setPetSelecionado(null);setTabInicial(null);}} onEdit={()=>setPetEditando(petSelecionado)} initialTab={tabInicial} />
      )}
      {view === 'perdidos' && <PainelPetsPerdidos pets={pets} user={user} onRefresh={carregarDados} />}
      {view === 'profile' && <TutorProfile user={user} onUpdate={(u)=>setUser({...user, ...u})} onGerarPrevia={()=>setView('preview')} />}
      {view === 'preview' && <PreviewScreen onBack={()=>setView('profile')} />}
      {view === 'admin' && isAdmin && <AdminPanel user={user} pets={pets} orders={orders} coupons={coupons} settings={settings} onRefresh={carregarDados} />}
      {verPet && <ModoApresentacao pet={pets.find(p=>p.id===verPet.id)||verPet} tutor={user} qrLiberado={orders.some(o=>String(o.pet_id)===String(verPet.id) && o.tipo==='combo2' && o.status==='pago')} onClose={()=>setVerPet(null)} />}
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
