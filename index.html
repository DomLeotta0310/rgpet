<script type="text/babel">
const { useState, useEffect } = React;

const RACAS_DB = {
  'bulldog inglês': 'O Bulldog Inglês surgiu na Inglaterra e teve origem ligada a antigos cães de trabalho e de arena, atividades proibidas em 1835. A partir daí, criadores passaram a selecionar exemplares de temperamento dócil e companheiro, dando origem ao cão de estimação equilibrado e afetuoso que conhecemos hoje. É um símbolo tradicional da cultura britânica e, apesar da aparência robusta, é conhecido por ser calmo, apegado à família e tolerante com crianças.',
  'bulldog': 'O Bulldog Inglês surgiu na Inglaterra e teve origem ligada a antigos cães de trabalho e de arena, atividades proibidas em 1835. A partir daí, criadores passaram a selecionar exemplares de temperamento dócil e companheiro.',
  'poodle': 'O Poodle é originário da Alemanha, onde era conhecido como "cão d\'água", mas foi na França que ganhou popularidade e refinamento. Inteligente, elegante e muito apegado ao tutor, é considerado uma das raças mais inteligentes do mundo.',
  'labrador': 'O Labrador Retriever é originário do Canadá. Criado para ajudar pescadores a trazer redes e cordas da água, ficou conhecido pela docilidade, inteligência e amor pela água e pelo trabalho.',
  'golden retriever': 'O Golden Retriever surgiu na Escócia no século XIX, criado para caçar aves aquáticas. É conhecido pela docilidade, inteligência e lealdade.',
  'pinscher': 'O Pinscher é uma raça de origem alemã, conhecida como "Pinscher Miniatura". Apesar do tamanho pequeno, tem personalidade forte, é alerta, ativo e muito apegado ao tutor.',
  'shih tzu': 'O Shih Tzu é uma raça tibetana, criada originalmente para viver em palácios chineses. É conhecido pela pelagem longa e sedosa, temperamento doce e apegado à família.',
  'pug': 'O Pug é originário da China, criado para ser cão de companhia da nobreza. É brincalhão, afetuoso e adora atenção.',
  'srd': 'SRD significa "Sem Raça Definida" — o famoso vira-lata. São cães únicos, geralmente mais resistentes a doenças, extremamente leais e cheios de personalidade.',
  'vira-lata': 'SRD significa "Sem Raça Definida" — o famoso vira-lata. São cães únicos, extremamente leais e cheios de personalidade.',
  'pastor alemão': 'O Pastor Alemão é originário da Alemanha, criado no fim do século XIX para pastoreio e trabalho. É inteligente, leal, corajoso e extremamente versátil.',
  'rottweiler': 'O Rottweiler é originário da Alemanha, descendente de cães romanos. É forte, leal e protetor.',
  'yorkshire': 'O Yorkshire Terrier surgiu na Inglaterra, criado para caçar ratos nas fábricas. Apesar do tamanho pequeno, é corajoso, esperto e cheio de energia.',
  'maltês': 'O Maltês é uma das raças mais antigas do mundo, originária da Ilha de Malta. É dócil, apegado, inteligente e adora colo.',
};

const buscarHistoriaRaca = (raca) => {
  if (!raca) return null;
  const key = raca.toLowerCase().trim();
  for (const k in RACAS_DB) { if (key.includes(k) || k.includes(key)) return RACAS_DB[k]; }
  return null;
};

const defaultDB = {
  users: [], pets: [], orders: [],
  coupons: [
    { code: 'TESTE100', desconto: 100, ativo: true },
    { code: 'PROMO10',  desconto: 66,  ativo: true }
  ],
  settings: { paymentMode: 'auto', priceCombo1: 29.90, priceCombo2: 10.00 }
};

const useDB = () => {
  const [db, setDb] = useState(() => {
    try { const saved = localStorage.getItem('rg_pet_db_v3'); return saved ? { ...defaultDB, ...JSON.parse(saved) } : defaultDB; }
    catch { return defaultDB; }
  });
  useEffect(() => { localStorage.setItem('rg_pet_db_v3', JSON.stringify(db)); }, [db]);
  return [db, setDb];
};

const calcularStatusVacina = (dataAplicacao) => {
  if (!dataAplicacao) return { label: 'Sem data', pillBg: '#e5e7eb', pillText: '#374151' };
  const meses = (new Date() - new Date(dataAplicacao)) / (1000 * 60 * 60 * 24 * 30.44);
  if (meses <= 8) return { label: 'Em dia', pillBg: '#dcfce7', pillText: '#15803d' };
  if (meses <= 12) return { label: 'Atenção', pillBg: '#fef3c7', pillText: '#a16207' };
  return { label: 'Vencida', pillBg: '#fee2e2', pillText: '#b91c1c' };
};

        <div className="flex items-center gap-2.5">
          <div className="w-9 h-9 rounded-full flex items-center justify-center text-white text-base" style={{backgroundColor:'#eab308'}}>🐾</div>
          <span className="font-bold text-sm" style={{color:'#1a3c2e'}}>RG Pet Cão Leotta</span>
        </div>
        <div className="flex gap-4 items-center">
          <button onClick={onLoginClick} className="text-sm font-semibold" style={{color:'#1a3c2e'}}>Entrar</button>
          <button onClick={onRegisterClick} className="px-4 py-2 text-sm font-semibold text-white rounded-lg" style={{backgroundColor:'#1a3c2e'}}>Criar RG do meu pet</button>
        </div>

    <section className="px-6 pt-10 pb-10 text-center">
      <div className="max-w-3xl mx-auto">
        <div className="text-[11px] tracking-widest text-gray-500 mb-6 font-medium">DOCUMENTO DIGITAL DO SEU ANIMAL</div>
        <h1 className="text-3xl font-bold mb-5 leading-tight" style={{color:'#1a3c2e'}}>O RG Pet que é, de verdade, a<br/>ficha completa do seu pet</h1>
        <p className="text-sm text-gray-600 max-w-xl mx-auto mb-7">Identificação, saúde, comportamento, contatos do tutor e carteira de vacinação com sinalização por cores — em um único documento bonito e organizado.</p>
        <button onClick={onRegisterClick} className="btn-primary px-6 py-3 rounded-lg font-semibold text-sm shadow-sm mb-8">Cadastrar meu pet</button>
        <div className="flex justify-center flex-wrap gap-2 text-xs">
          <div className="flex items-center gap-1.5 px-3 py-1.5 rounded-full border border-gray-200 bg-white"><span className="w-2 h-2 rounded-full bg-green-500"></span><span className="text-gray-700">Em dia</span></div>
          <div className="flex items-center gap-1.5 px-3 py-1.5 rounded-full border border-gray-200 bg-white"><span className="w-2 h-2 rounded-full bg-yellow-500"></span><span className="text-gray-700">Atenção</span></div>
          <div className="flex items-center gap-1.5 px-3 py-1.5 rounded-full border border-gray-200 bg-white"><span className="w-2 h-2 rounded-full bg-red-500"></span><span className="text-gray-700">Vencida</span></div>

    <section className="px-6 pb-10">
      <div className="max-w-3xl mx-auto" style={{display:'grid', gridTemplateColumns:'repeat(auto-fit, minmax(280px, 1fr))', gap:'12px'}}>
        <div className="bg-white border border-gray-200 rounded-xl p-5"><div className="text-base mb-3">🎯</div><div className="font-bold text-sm mb-1.5" style={{color:'#1a3c2e'}}>Número exclusivo de RG</div><div className="text-xs text-gray-600">Cada pet recebe um número único de identificação, com foto e todos os dados essenciais.</div></div>

        <div className="bg-white border border-gray-200 rounded-xl p-5"><div className="text-base mb-3">✅</div><div className="font-bold text-sm mb-1.5" style={{color:'#1a3c2e'}}>Útil na hora certa</div><div className="text-xs text-gray-600">Pronto para veterinário, pet shop, banho e tosa, casa de ração e casos de perda.</div></div>
      </div>
    </section>
    <section className="px-6 pb-12">
      <div className="max-w-3xl mx-auto flex items-start gap-2.5 text-xs text-gray-600">
        <span className="text-sm flex-shrink-0">📱</span>
        <div><strong style={{color:'#1a3c2e'}}>QR Code opcional</strong> — vendido separadamente, para coleira ou plaquinha. Ao ser lido, abre o perfil público com apenas as informações que o tutor autorizar. Não faz parte do RG principal.</div>
      </div>
    </section>
    <footer className="px-6 pb-10">
      <div className="max-w-3xl mx-auto pt-6 border-t border-gray-200 text-[11px] text-gray-400 text-center">RG Pet Cão Leotta — documento digital para tutores, veterinários e pet shops.</div>

// LOGIN
const LoginScreen = ({ onLogin, db, setDb, initialRegister, onBackToLanding }) => {
  const [modo, setModo] = useState(initialRegister ? 'register' : 'login');
  const [form, setForm] = useState({ nome: '', email: '', senha: '' });
  const [resetEmail, setResetEmail] = useState('');
  const [novaSenha, setNovaSenha] = useState('');
  const [resetEtapa, setResetEtapa] = useState(1);
  const [erro, setErro] = useState('');
  const [msg, setMsg] = useState('');
  const [mostrarSenha, setMostrarSenha] = useState(false);
  const [mostrarNovaSenha, setMostrarNovaSenha] = useState(false);

  useEffect(() => {
    setModo(initialRegister ? 'register' : 'login');
    setErro(''); setMsg(''); setResetEtapa(1); setResetEmail(''); setNovaSenha('');
  }, [initialRegister]);

  const submitLogin = (e) => {
    e.preventDefault();
    if (modo === 'register') {
      if (!form.nome || !form.email || !form.senha) { setErro('Preencha todos os campos'); return; }
      if (db.users.find(u => u.email === form.email)) { setErro('E-mail já cadastrado'); return; }
      const novo = { id: Date.now(), nome: form.nome, email: form.email, senha: form.senha, cpf:'', telefone:'', whatsapp:'', endereco:'', cidade:'', uf:'', cep:'' };
      setDb({...db, users: [...db.users, novo]});
      onLogin(novo);
    } else {
      const u = db.users.find(u => u.email === form.email && u.senha === form.senha);
      if (!u) { setErro('E-mail ou senha incorretos'); return; }
      onLogin(u);
    }
  };

  const iniciarReset = () => {
    const email = resetEmail.trim().toLowerCase();
    if (!email) { setErro('Digite seu e-mail'); return; }
    const existe = db.users.find(u => u.email.toLowerCase() === email);
    if (!existe) { setErro('E-mail não encontrado. Verifique ou cadastre-se.'); return; }
    setErro(''); setResetEtapa(2); setMsg(`E-mail confirmado: ${existe.email}`);
  };

  const confirmarNovaSenha = () => {
    if (!novaSenha || novaSenha.length < 4) { setErro('A senha precisa ter pelo menos 4 caracteres'); return; }
    const email = resetEmail.trim().toLowerCase();
    const user = db.users.find(u => u.email.toLowerCase() === email);
    if (!user) { setErro('E-mail não encontrado'); return; }
    setDb({...db, users: db.users.map(u => u.id === user.id ? { ...u, senha: novaSenha } : u)});
    setErro(''); setMsg('✓ Senha redefinida com sucesso!'); setResetEtapa(3);
  };

  const voltarAoLogin = () => {
    setModo('login'); setErro(''); setMsg(''); setResetEtapa(1); setResetEmail(''); setNovaSenha('');
    setForm({ nome: '', email: resetEmail, senha: '' });
  };

  return (
    <div className="min-h-screen flex items-center justify-center p-4" style={{backgroundColor:'#faf6ec'}}>
      <div className="w-full max-w-sm">
        <button onClick={onBackToLanding} className="text-xs text-gray-500 mb-4">← Voltar</button>
        <div className="text-center mb-6">

// DASHBOARD
const Dashboard = ({ user, db, onOpenPet, onNewPet }) => {
  const pets = db.pets.filter(p => p.tutorId === user.id);
  const temCombo1 = (id) => db.orders.some(o => o.petId===id && o.tipo==='combo1' && o.status==='pago');
  const temCombo2 = (id) => db.orders.some(o => o.petId===id && o.tipo==='combo2' && o.status==='pago');
  return (
    <div className="mobile-container p-4">
      <h1 className="text-xl font-bold mb-1">Meus animais</h1>
      <p className="text-xs text-gray-500 mb-4">Cada pet tem seu RG e sua carteira de vacinação.</p>
      <button onClick={onNewPet} className="btn-primary px-5 py-2.5 rounded-xl font-semibold mb-4 text-sm">+ Novo RG Pet</button>
      <div className="space-y-3">
        {pets.length === 0 && <div className="card text-center text-gray-500 text-sm">Nenhum pet cadastrado ainda.</div>}
        {pets.map(pet => {
          const c1 = temCombo1(pet.id), c2 = temCombo2(pet.id);
          return (
            <div key={pet.id} className="card flex items-center gap-3 cursor-pointer" onClick={()=>onOpenPet(pet)}>
              <div className="w-16 h-16 rounded-xl overflow-hidden bg-gray-100 flex-shrink-0">
                {pet.foto ? <img src={pet.foto} style={{width:'100%',height:'100%',objectFit:'cover'}} /> : <div className="flex items-center justify-center" style={{width:'100%',height:'100%',fontSize:'24px',color:'#d1d5db'}}>🐾</div>}
              </div>
              <div className="flex-1 min-w-0">
                <div className="text-xs text-gray-400 mb-0.5">{pet.registroId || 'CL-'+String(pet.id).slice(-6)}</div>
                <div className="font-bold text-base truncate">{pet.nome}</div>
                <div className="text-xs text-gray-500 truncate">{pet.raca||'—'} • {pet.porte||'—'} {pet.sexo?'• '+pet.sexo:''}</div>
                <div className="flex gap-1 mt-1 flex-wrap">
                  {c1 && <span className="text-xs px-2 py-0.5 rounded-full bg-green-100 text-green-700">Combo 1 ✓</span>}
                  {c2 && <span className="text-xs px-2 py-0.5 rounded-full bg-blue-100 text-blue-700">QR ✓</span>}
                  {pet.isLost && <span className="text-xs px-2 py-0.5 rounded-full bg-red-100 text-red-700">⚠ PERDIDO</span>}
                </div>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
};

    if (!form.nome) { alert('Informe o nome do pet'); return; }

    const pet = {

// PET DETAIL
const PetDetail = ({ user, pet, db, setDb, onBack, initialTab }) => {
  const [aba, setAba] = useState(initialTab || 'documentos');
  const [cupom, setCupom] = useState('');
  const [cupomAplicado, setCupomAplicado] = useState(null);
  const [mostrarCupom, setMostrarCupom] = useState(false);

  const temCombo1 = db.orders.some(o => o.petId===pet.id && o.tipo==='combo1' && o.status==='pago');
  const temCombo2 = db.orders.some(o => o.petId===pet.id && o.tipo==='combo2' && o.status==='pago');
  const pedidosPet = db.orders.filter(o => o.petId === pet.id);

  const aplicarCupom = () => {
    const c = db.coupons.find(c => c.code.toLowerCase() === cupom.toLowerCase() && c.ativo);
    if (!c) { alert('Cupom inválido'); return; }
    setCupomAplicado(c); alert(`Cupom aplicado: ${c.desconto}% off!`);
  };
  const calcular = (base) => cupomAplicado ? +(base * (1 - cupomAplicado.desconto/100)).toFixed(2) : base;

  const comprar = (tipo) => {
    if (tipo === 'combo2' && !temCombo1) { alert('Adquira o Combo 1 antes do QR Code.'); return; }
    const base = tipo === 'combo1' ? db.settings.priceCombo1 : db.settings.priceCombo2;
    const valor = calcular(base);
    const status = db.settings.paymentMode === 'auto' ? 'pago' : 'pendente';
    setDb({...db, orders: [...db.orders, { id: Date.now(), petId: pet.id, userId: user.id, tipo, valorBase: base, valor, status, metodo: db.settings.paymentMode, cupom: cupomAplicado?.code || null, criadoEm: new Date().toISOString() }]});
    alert(status === 'pago' ? `Pagamento aprovado! R$ ${valor.toFixed(2)}.` : `Pedido registrado. Envie o comprovante. Valor: R$ ${valor.toFixed(2)}`);
    setCupom(''); setCupomAplicado(null); setMostrarCupom(false);
  };

  const marcarPerdido = () => setDb({...db, pets: db.pets.map(p => p.id===pet.id ? {...p, isLost: true} : p)});
  const marcarEmCasa = () => setDb({...db, pets: db.pets.map(p => p.id===pet.id ? {...p, isLost: false} : p)});

  const publicUrl = `${window.location.origin}${window.location.pathname}?pet=${pet.publicId}`;

  return (
    <div className="mobile-container p-4">
      <button onClick={onBack} className="text-sm text-gray-500 mb-3">← Voltar</button>

      <div className="mb-3"><RGDocumento pet={pet} tutor={user} /></div>

      <div className="flex gap-2 mb-3">
        <button onClick={marcarPerdido} className="flex-1 py-2.5 rounded-xl text-sm font-semibold" style={pet.isLost ? {backgroundColor:'#dc2626', color:'white'} : {backgroundColor:'#f3f4f6', color:'#9ca3af'}}>⚠ Perdido</button>
        <button onClick={marcarEmCasa} className="flex-1 py-2.5 rounded-xl text-sm font-semibold" style={!pet.isLost ? {backgroundColor:'#16a34a', color:'white'} : {backgroundColor:'#f3f4f6', color:'#9ca3af'}}>✓ Em casa</button>
      </div>

      <div className="flex gap-1 mb-3 border-b overflow-x-auto">
        {['documentos','pagamento','qrcode'].map(t => (
          <button key={t} onClick={()=>setAba(t)} className="px-3 py-2 text-xs font-medium whitespace-nowrap" style={aba===t?{borderBottom:'2px solid #1a3c2e', color:'#1a3c2e'}:{color:'#6b7280'}}>
            {t === 'documentos' ? 'Documentos' : t === 'pagamento' ? 'Pagamento' : 'QR Code'}
          </button>
        ))}
      </div>

      {aba === 'documentos' && (
        <div className="space-y-3">
          <div className="card border">
            <div className="font-bold mb-3 text-sm" style={{color:'#1a3c2e'}}>CARTEIRA DE VACINAÇÃO</div>
            {(!pet.vaccinations || pet.vaccinations.length === 0) ? (
              <div className="text-xs text-gray-500 mb-3">Nenhuma vacina registrada.</div>
            ) : (
              <div className="space-y-2 mb-3">
                {pet.vaccinations.map(v => {
                  const s = calcularStatusVacina(v.data);
                  return (
                    <div key={v.id} className="text-xs rounded-lg p-3 flex justify-between items-center" style={{backgroundColor:'#faf6ec', border:'1px solid #e8dfc8'}}>
                      <div>
                        <div className="font-semibold" style={{color:'#1a3c2e'}}>{v.nome}</div>
                        <div className="text-gray-500">Aplicada em: {new Date(v.data).toLocaleDateString('pt-BR')}</div>
                      </div>
                      <span className="text-xs px-2 py-0.5 rounded-full font-semibold whitespace-nowrap" style={{backgroundColor:s.pillBg, color:s.pillText}}>{s.label}</span>
                    </div>
                  );
                })}
              </div>
            )}
            <div className="rounded-lg p-3 mt-3" style={{backgroundColor:'#faf6ec', border:'1px solid #e8dfc8'}}>
              <div className="text-[10px] tracking-[0.2em] font-bold mb-2" style={{color:'#8b7a4d'}}>INFORMAÇÕES DE SAÚDE</div>
              <div className="space-y-1 text-xs">
                <div><span className="text-gray-500">Doenças:</span> {pet.saude?.doencas||'—'}</div>
                <div><span className="text-gray-500">Alergias:</span> {pet.saude?.alergias||'—'}</div>
                <div><span className="text-gray-500">Medicamentos:</span> {pet.saude?.medicamentos||'—'}</div>
                <div><span className="text-gray-500">Tipo sanguíneo:</span> {pet.saude?.tipoSanguineo||'—'}</div>
                <div><span className="text-gray-500">Comportamento:</span> {pet.saude?.comportamento||'—'}</div>
                {pet.saude?.observacoes && <div><span className="text-gray-500">Obs:</span> {pet.saude.observacoes}</div>}
              </div>
            </div>
            {(pet.emergencia?.nome || pet.emergencia?.telefone) && (
              <div className="rounded-lg p-3 mt-3 text-white" style={{backgroundColor:'#dc2626'}}>
                <div className="text-[10px] tracking-[0.2em] font-bold mb-1" style={{color:'#fee2e2'}}>⚠ CONTATO DE EMERGÊNCIA</div>
                <div className="text-xs font-semibold">{pet.emergencia.nome} {pet.emergencia.relacao && `(${pet.emergencia.relacao})`}</div>
                <div className="text-xs mt-0.5">{pet.emergencia.telefone}</div>
              </div>
            )}
          </div>
          <Certidao pet={pet} tutor={user} />
        </div>
      )}

      {aba === 'pagamento' && (
        <div className="space-y-3">
          <div className="card">
            <h2 className="font-bold text-sm mb-1">Novo pedido</h2>
            <p className="text-xs text-gray-500 mb-3">O documento é liberado após confirmação do pagamento.</p>
            <div className="space-y-2">
              <div className="border rounded-lg p-3 flex justify-between items-center">
                <div className="font-semibold text-xs">Combo 1 — RG + Carteirinha + Certidão</div>
                <div className="text-right ml-2">
                  <div className="font-bold text-sm">R$ {calcular(db.settings.priceCombo1).toFixed(2)}</div>
                  {!temCombo1 && <button onClick={()=>comprar('combo1')} className="btn-primary text-xs px-3 py-1 rounded-lg mt-1">Comprar</button>}
                  {temCombo1 && <span className="text-xs text-green-700">✓ Adquirido</span>}
                </div>
              </div>
              <div className="border rounded-lg p-3 flex justify-between items-center">
                <div>
                  <div className="font-semibold text-xs">Combo 2 — QR Code</div>
                  <div className="text-xs text-gray-500">{temCombo1 ? 'Adicional plaquinha' : 'Requer Combo 1'}</div>
                </div>
                <div className="text-right ml-2">
                  <div className="font-bold text-sm">R$ {calcular(db.settings.priceCombo2).toFixed(2)}</div>
                  {!temCombo2 && temCombo1 && <button onClick={()=>comprar('combo2')} className="btn-yellow text-xs px-3 py-1 rounded-lg mt-1">Comprar</button>}
                  {temCombo2 && <span className="text-xs text-green-700">✓ Adquirido</span>}
                </div>
              </div>
            </div>
            <button onClick={()=>setMostrarCupom(!mostrarCupom)} className="text-xs text-gray-600 underline mt-3">{mostrarCupom ? 'Fechar cupom' : 'Tenho um cupom'}</button>
            {mostrarCupom && (
              <div className="flex gap-2 mt-2">
                <input className="input-field text-sm" placeholder="Cupom" value={cupom} onChange={e=>setCupom(e.target.value)} />
                <button onClick={aplicarCupom} className="btn-primary px-4 rounded-xl text-sm">Aplicar</button>
              </div>
            )}
            {cupomAplicado && <div className="text-xs text-green-700 mt-2">Cupom {cupomAplicado.code} ({cupomAplicado.desconto}% off)</div>}
            <div className="text-xs text-gray-500 mt-3 p-2 rounded-lg" style={{backgroundColor:'#faf6ec'}}>Modo: <strong>{db.settings.paymentMode === 'auto' ? 'Automático' : 'Manual'}</strong></div>
          </div>
          {pedidosPet.length > 0 && (
            <div>
              <h3 className="font-bold text-sm mb-2">Meus pedidos</h3>
              <div className="space-y-2">
                {pedidosPet.map(p => (
                  <div key={p.id} className="card flex justify-between items-center py-2">
                    <div className="text-xs font-semibold">{p.tipo === 'combo1' ? 'Combo 1' : 'Combo 2 (QR)'}</div>
                    <div className="text-right text-xs">
                      <div className="font-bold">R$ {p.valor.toFixed(2)}</div>
                      <div className={p.status==='pago'?'text-green-700':'text-yellow-700'}>{p.status === 'pago' ? '✓ Pago' : '⏳ Pendente'}</div>

              </div>

            </>
          ) : (
            <div className="text-xs text-gray-600 py-6">Adquira o <strong>Combo 2</strong> para liberar o QR Code.<br/>Ele só libera após a compra do Combo 1.</div>
          )}
        </div>
      )}
    </div>
  );
};

// PÚBLICA
const PublicPetView = ({ db, publicId }) => {
  const pet = db.pets.find(p => p.publicId === publicId);
  const tutor = pet ? db.users.find(u => u.id === pet.tutorId) : null;
  if (!pet || !tutor) return <div className="min-h-screen flex items-center justify-center p-4"><div className="card text-center text-sm">Pet não encontrado.</div></div>;
  return (
    <div className="min-h-screen flex items-center justify-center p-4" style={{backgroundColor:'#faf6ec'}}>
      <div className="w-full max-w-sm">
        {pet.isLost && (
          <div className="text-white text-center p-3 rounded-xl mb-3" style={{backgroundColor:'#dc2626'}}>
            <div className="font-bold text-base">⚠ ESTE PET ESTÁ PERDIDO</div>
            <div className="text-xs mt-1">Se você o encontrou, entre em contato imediatamente.</div>
          </div>
        )}
        <div className="card text-center" style={{border:'4px solid #1a3c2e'}}>
          <div className="w-12 h-12 rounded-full flex items-center justify-center text-white text-xl mx-auto mb-2" style={{backgroundColor:'#eab308'}}>🐾</div>
          <h1 className="text-lg font-bold mb-1">Pet Encontrado!</h1>
          <p className="text-xs text-gray-500 mb-3">Este pet está registrado no RG Pet.</p>
          <div className="w-28 h-28 rounded-full overflow-hidden mx-auto mb-2" style={{border:'4px solid #eab308'}}>
            {pet.foto ? <img src={pet.foto} style={{width:'100%',height:'100%',objectFit:'cover'}} /> : <div className="flex items-center justify-center" style={{width:'100%',height:'100%',fontSize:'32px',color:'#d1d5db'}}>🐾</div>}
          </div>
          <div className="font-bold text-base">{pet.nome}</div>
          <div className="text-xs text-gray-500">{pet.raca||'—'} • {pet.porte||'—'}</div>
          {pet.saude?.comportamento && <div className="text-xs text-gray-500 mt-2">Comportamento: <strong>{pet.saude.comportamento}</strong></div>}
          <div className="space-y-2 mt-4">
            <a href={`tel:${tutor.telefone}`} className="btn-primary w-full py-3 rounded-xl font-semibold flex items-center justify-center gap-2 text-sm" style={{display:'flex'}}>📞 Ligar para o tutor</a>
            <a href={`https://wa.me/55${(tutor.whatsapp||'').replace(/\D/g,'')}`} target="_blank" className="w-full py-3 rounded-xl font-semibold flex items-center justify-center gap-2 text-white text-sm" style={{backgroundColor:'#25D366', display:'flex'}}>💬 Chamar no WhatsApp</a>
          </div>
          {(pet.emergencia?.nome || pet.emergencia?.telefone) && (
            <div className="mt-3 pt-3 text-xs text-gray-500" style={{borderTop:'1px solid #e5e7eb'}}>Sem contato? Ligue para <strong>{pet.emergencia.nome}</strong> ({pet.emergencia.relacao}) — {pet.emergencia.telefone}</div>
          )}
        </div>
      </div>
    </div>
  );
};

// ADMIN
const AdminPanel = ({ db, setDb }) => {
  const [aba, setAba] = useState('pedidos');
  const [novoCupom, setNovoCupom] = useState({ code:'', desconto: 100 });
  const [precos, setPrecos] = useState({ c1: db.settings.priceCombo1, c2: db.settings.priceCombo2 });
  const toggleMode = () => setDb({...db, settings:{...db.settings, paymentMode: db.settings.paymentMode==='auto'?'manual':'auto'}});
  const salvarPrecos = () => { setDb({...db, settings:{...db.settings, priceCombo1: parseFloat(precos.c1), priceCombo2: parseFloat(precos.c2)}}); alert('Preços atualizados!'); };
  const aprovarPedido = (id) => { setDb({...db, orders: db.orders.map(o => o.id===id ? {...o, status:'pago'} : o)}); alert('Pedido aprovado!'); };
  const criarCupom = () => { if (!novoCupom.code) return; setDb({...db, coupons:[...db.coupons, { ...novoCupom, ativo: true }]}); setNovoCupom({ code:'', desconto: 100 }); };
  const toggleCupom = (code) => setDb({...db, coupons: db.coupons.map(c => c.code===code ? {...c, ativo: !c.ativo} : c)});
  const toggleLost = (id) => setDb({...db, pets: db.pets.map(p => p.id===id ? {...p, isLost: !p.isLost} : p)});
  const pendentes = db.orders.filter(o => o.status === 'pendente');
  return (
    <div className="mobile-container p-4">
      <h1 className="text-xl font-bold mb-4">Painel Admin</h1>
      <div className="flex gap-1 mb-3 border-b overflow-x-auto">
        {['pedidos','precos','cupons','pets','usuarios'].map(t => (
          <button key={t} onClick={()=>setAba(t)} className="px-3 py-2 text-xs font-medium whitespace-nowrap" style={aba===t?{borderBottom:'2px solid #1a3c2e', color:'#1a3c2e'}:{color:'#6b7280'}}>{t === 'pedidos' ? 'Pedidos' : t === 'precos' ? 'Preços' : t === 'cupons' ? 'Cupons' : t === 'pets' ? 'Pets' : 'Usuários'}</button>
        ))}
      </div>
      {aba === 'pedidos' && (
        <>
          <div className="card mb-3 flex justify-between items-center">
            <div><div className="font-bold text-sm">Modo de pagamento</div><div className="text-xs text-gray-500">Atual: <strong>{db.settings.paymentMode === 'auto' ? 'Automático' : 'Manual'}</strong></div></div>
            <button onClick={toggleMode} className="px-4 py-2 rounded-xl text-white font-semibold text-xs" style={{backgroundColor: db.settings.paymentMode==='auto' ? '#16a34a' : '#ca8a04'}}>→ {db.settings.paymentMode==='auto'?'Manual':'Auto'}</button>
          </div>
          <h2 className="font-bold text-sm mb-2">Pendentes ({pendentes.length})</h2>
          {pendentes.length === 0 ? (
            <div className="card text-xs text-gray-500 text-center">Nenhum pendente.</div>
          ) : (
            <div className="space-y-2">
              {pendentes.map(o => {
                const pet = db.pets.find(p => p.id===o.petId);
                const u = db.users.find(u => u.id===o.userId);
                return (
                  <div key={o.id} className="card py-3">
                    <div className="flex justify-between items-start">
                      <div className="flex-1 min-w-0">
                        <div className="font-semibold text-sm">{pet?.nome || '—'}</div>
                        <div className="text-xs text-gray-500">Tutor: {u?.nome || '—'}</div>
                        <div className="text-xs">{o.tipo==='combo1'?'Combo 1':'Combo 2 (QR)'} • R$ {o.valor.toFixed(2)}</div>
                      </div>
                      <button onClick={()=>aprovarPedido(o.id)} className="btn-primary px-3 py-1.5 rounded-lg text-xs font-semibold ml-2">Aprovar</button>
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </>
      )}
      {aba === 'precos' && (
        <div className="card space-y-3">
          <h2 className="font-bold text-sm">Editar preços</h2>
          <div><div className="label">Combo 1 (R$)</div><input type="number" step="0.01" className="input-field" value={precos.c1} onChange={e=>setPrecos({...precos, c1: e.target.value})} /></div>
          <div><div className="label">Combo 2 — QR Code (R$)</div><input type="number" step="0.01" className="input-field" value={precos.c2} onChange={e=>setPrecos({...precos, c2: e.target.value})} /></div>
          <button onClick={salvarPrecos} className="btn-primary w-full py-2 rounded-xl font-semibold text-sm">Salvar preços</button>
        </div>
      )}
      {aba === 'cupons' && (
        <>
          <div className="card mb-3 space-y-3">
            <h2 className="font-bold text-sm">Novo cupom</h2>
            <div><div className="label">Código</div><input className="input-field" value={novoCupom.code} onChange={e=>setNovoCupom({...novoCupom, code: e.target.value.toUpperCase()})} placeholder="TESTE100" /></div>
            <div><div className="label">Desconto (%)</div><input type="number" className="input-field" value={novoCupom.desconto} onChange={e=>setNovoCupom({...novoCupom, desconto: parseInt(e.target.value)||0})} /></div>
            <button onClick={criarCupom} className="btn-primary w-full py-2 rounded-xl font-semibold text-sm">Criar</button>
          </div>
          <div className="space-y-2">
            {db.coupons.map(c => (
              <div key={c.code} className="card flex justify-between items-center py-2">
                <div><div className="font-semibold text-sm">{c.code}</div><div className="text-xs text-gray-500">{c.desconto}% off</div></div>
                <button onClick={()=>toggleCupom(c.code)} className="px-3 py-1.5 rounded-lg text-xs font-semibold" style={c.ativo?{backgroundColor:'#dcfce7', color:'#15803d'}:{backgroundColor:'#f3f4f6', color:'#6b7280'}}>{c.ativo ? 'Ativo' : 'Inativo'}</button>
              </div>
            ))}
          </div>
        </>
      )}
      {aba === 'pets' && (
        <div className="space-y-2">
          {db.pets.length === 0 && <div className="card text-xs text-gray-500 text-center">Nenhum pet.</div>}
          {db.pets.map(pet => {
            const u = db.users.find(u => u.id === pet.tutorId);
            return (
              <div key={pet.id} className="card py-3">
                <div className="flex justify-between items-center">
                  <div className="flex-1 min-w-0"><div className="font-semibold text-sm">{pet.nome}</div><div className="text-xs text-gray-500 truncate">{u?.nome || '—'}</div></div>
                  <button onClick={()=>toggleLost(pet.id)} className="px-3 py-1.5 rounded-lg text-xs font-semibold ml-2 text-white" style={{backgroundColor: pet.isLost?'#16a34a':'#dc2626'}}>{pet.isLost ? 'Encontrado' : 'Perdido'}</button>
                </div>
              </div>
            );
          })}
        </div>
      )}
      {aba === 'usuarios' && (
        <div className="space-y-2">
          <p className="text-xs text-gray-500 mb-2">Redefinir senha de qualquer usuário.</p>
          {db.users.length === 0 && <div className="card text-xs text-gray-500 text-center">Nenhum usuário.</div>}
          {db.users.map(u => (
            <div key={u.id} className="card py-3">
              <div className="flex justify-between items-center">
                <div className="flex-1 min-w-0">
                  <div className="font-semibold text-sm">{u.nome}</div>
                  <div className="text-xs text-gray-500 truncate">{u.email}</div>
                  <div className="text-[10px] text-gray-400">Senha: {u.senha}</div>
                </div>
                <button onClick={()=>{
                  const nova = prompt(`Nova senha para ${u.nome}:`, '1234');
                  if (nova) { setDb({...db, users: db.users.map(x => x.id===u.id ? {...x, senha: nova} : x)}); alert('Senha alterada!'); }
                }} className="px-3 py-1.5 rounded-lg text-xs font-semibold ml-2 text-white" style={{backgroundColor:'#1a3c2e'}}>Redefinir</button>
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
};

// APP
const App = () => {
  const [db, setDb] = useDB();
  const [user, setUser] = useState(null);
  const [view, setView] = useState('landing');
  const [petSelecionado, setPetSelecionado] = useState(null);
  const [tabInicial, setTabInicial] = useState(null);
  const [publicId, setPublicId] = useState(null);
  const [isAdmin, setIsAdmin] = useState(false);
  const [registerMode, setRegisterMode] = useState(false);

  useEffect(() => {
    const params = new URLSearchParams(window.location.search);
    const p = params.get('pet'); if (p) setPublicId(p);
    if (params.get('admin') === '1') setIsAdmin(true);
  }, []);

  if (publicId) return <PublicPetView db={db} publicId={publicId} />;
  if (!user) {
    if (view === 'landing') return <LandingPage onLoginClick={()=>{setRegisterMode(false);setView('login');}} onRegisterClick={()=>{setRegisterMode(true);setView('login');}} />;
    return <LoginScreen db={db} setDb={setDb} initialRegister={registerMode} onBackToLanding={()=>setView('landing')} onLogin={u=>{setUser(u);setView('dashboard');}} />;
  }
  const userFresh = db.users.find(u => u.id === user.id) || user;
  return (
    <div className="min-h-screen" style={{backgroundColor:'#faf6ec'}}>
      <Navbar user={userFresh} currentView={view} onNavigate={setView} onLogout={()=>{setUser(null);setPetSelecionado(null);setView('landing');}} isAdmin={isAdmin} />
      {view === 'dashboard' && !petSelecionado && <Dashboard user={userFresh} db={db} onOpenPet={setPetSelecionado} onNewPet={()=>setView('newPet')} />}
      {view === 'newPet' && <PetForm user={userFresh} db={db} setDb={setDb} onSaved={p=>{setPetSelecionado(p);setView('dashboard');}} onCancel={()=>setView('dashboard')} />}
      {view === 'dashboard' && petSelecionado && <PetDetail user={userFresh} pet={db.pets.find(p=>p.id===petSelecionado.id)||petSelecionado} db={db} setDb={setDb} onBack={()=>{setPetSelecionado(null);setTabInicial(null);}} initialTab={tabInicial} />}
      {view === 'profile' && <TutorProfile user={userFresh} db={db} setDb={setDb} onGerarPrevia={()=>setView('preview')} />}
      {view === 'preview' && <PreviewScreen user={userFresh} db={db} onBack={()=>setView('profile')} onIrParaPagamento={(pet)=>{setPetSelecionado(pet);setTabInicial('pagamento');setView('dashboard');}} />}
      {view === 'admin' && isAdmin && <AdminPanel db={db} setDb={setDb} />}
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
