const normalizar = (s) => {
  if (!s) return '';
  return s.toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[\s\-_.]/g, '');
};

const levenshtein = (a, b) => {
  const m = a.length, n = b.length;
  if (m === 0) return n;
  if (n === 0) return m;
  const dp = [];
  for (let i = 0; i <= m; i++) { dp.push(new Array(n+1).fill(0)); dp[i][0] = i; }
  for (let j = 0; j <= n; j++) dp[0][j] = j;
  for (let i = 1; i <= m; i++) {
    for (let j = 1; j <= n; j++) {
      const cost = a[i-1] === b[j-1] ? 0 : 1;
      dp[i][j] = Math.min(dp[i-1][j]+1, dp[i][j-1]+1, dp[i-1][j-1]+cost);
    }
  }
  return dp[m][n];
};

const buscarHistoriaRaca = (raca) => {
  if (!raca) return null;
  const key = normalizar(raca);
  if (!key || key.length < 3) return null;

  // 1) Match exato
  for (const k in RACAS_DB) {
    if (key === normalizar(k)) return RACAS_DB[k];
  }
  // 2) Substring
  for (const k in RACAS_DB) {
    const kNorm = normalizar(k);
    if (key.includes(kNorm) || kNorm.includes(key)) return RACAS_DB[k];
  }
  // 3) Aproximado (Levenshtein)
  let melhor = null;
  let melhorDist = Infinity;
  for (const k in RACAS_DB) {
    const kNorm = normalizar(k);
    const d = levenshtein(key, kNorm);
    const limite = Math.max(2, Math.floor(kNorm.length * 0.35));
    if (d <= limite && d < melhorDist) {
      melhorDist = d;
      melhor = RACAS_DB[k];
    }
  }
  return melhor;
};

  if (meses <= 8) return { label: 'Em dia', pillBg: '#dcfce7', pillText: '#15803d' };
  if (meses <= 12) return { label: 'Atenção', pillBg: '#fef3c7', pillText: '#a16207' };
  return { label: 'Vencida', pillBg: '#fee2e2', pillText: '#b91c1c' };
};

const LoginScreen = ({ onLogin, initialRegister, onBackToLanding }) => {
  const [modo, setModo] = useState(initialRegister ? 'register' : 'login');
  const [form, setForm] = useState({ nome: '', email: '', senha: '', pin: '' });
  const [resetEmail, setResetEmail] = useState('');
  const [novaSenha, setNovaSenha] = useState('');
  const [resetEtapa, setResetEtapa] = useState(1);
  const [erro, setErro] = useState('');
  const [msg, setMsg] = useState('');
  const [mostrarSenha, setMostrarSenha] = useState(false);
  const [mostrarNovaSenha, setMostrarNovaSenha] = useState(false);
  const [carregando, setCarregando] = useState(false);

  useEffect(() => {
    setModo(initialRegister ? 'register' : 'login');
    setErro(''); setMsg('');
  }, [initialRegister]);

  const submitLogin = async (e) => {
    e.preventDefault();
    setErro(''); setCarregando(true);
    try {
      if (modo === 'register') {
        if (!form.nome || !form.email || !form.senha) { setErro('Preencha todos os campos'); setCarregando(false); return; }
        if (form.pin && form.pin.length !== 4) { setErro('O PIN precisa ter 4 dígitos'); setCarregando(false); return; }
        const { data: existe } = await sb.from('tutores').select('id').eq('email', form.email).maybeSingle();
        if (existe) { setErro('E-mail já cadastrado'); setCarregando(false); return; }
        const novo = {
          id: Date.now(), nome: form.nome, email: form.email, senha: form.senha,
          pin: form.pin || null, cpf: null, telefone: null, whatsapp: null,
          endereco: null, cidade: null, uf: null, cep: null
        };
        const { data, error } = await sb.from('tutores').insert([novo]).select().single();
        if (error) { setErro('Erro ao cadastrar: ' + error.message); setCarregando(false); return; }
        onLogin(data);
      } else {
        const { data, error } = await sb.from('tutores').select('*').eq('email', form.email).eq('senha', form.senha).maybeSingle();
        if (error || !data) { setErro('E-mail ou senha incorretos'); setCarregando(false); return; }
        onLogin(data);
      }
    } catch (err) {
      setErro('Erro: ' + err.message);
    }
    setCarregando(false);
  };

  const iniciarReset = async () => {
    setErro('');
    const email = resetEmail.trim().toLowerCase();
    if (!email) { setErro('Digite seu e-mail'); return; }
    const { data } = await sb.from('tutores').select('email').eq('email', email).maybeSingle();
    if (!data) { setErro('E-mail não encontrado.'); return; }
    setResetEtapa(2); setMsg(`E-mail confirmado: ${data.email}`);
  };

  const confirmarNovaSenha = async () => {
    setErro('');
    if (!novaSenha || novaSenha.length < 4) { setErro('Mínimo 4 caracteres'); return; }
    const email = resetEmail.trim().toLowerCase();
    const { error } = await sb.from('tutores').update({ senha: novaSenha }).eq('email', email);
    if (error) { setErro('Erro ao atualizar'); return; }
    setMsg('✓ Senha redefinida!'); setResetEtapa(3);
  };

  const voltarAoLogin = () => {
    setModo('login'); setErro(''); setMsg(''); setResetEtapa(1); setResetEmail(''); setNovaSenha('');
    setForm({ nome: '', email: resetEmail, senha: '', pin: '' });
  };

  return (
    <div className="min-h-screen flex items-center justify-center p-4" style={{backgroundColor:'#faf6ec'}}>
      <div className="w-full max-w-sm">
        <button onClick={onBackToLanding} className="text-xs text-gray-500 mb-4">← Voltar</button>
        <div className="text-center mb-6">
          <div className="w-12 h-12 rounded-full flex items-center justify-center text-white text-xl mx-auto mb-2" style={{backgroundColor:'#eab308'}}>🐾</div>
          <div className="font-bold text-base">RG Pet Cão Leotta</div>
        </div>
        <div className="card">
          {modo === 'login' && (
            <>
              <h1 className="text-xl font-bold mb-1">Entrar na sua conta</h1>
              <p className="text-xs text-gray-500 mb-5">Cadastre quantos pets quiser.</p>
              <form onSubmit={submitLogin} className="space-y-3">
                <div><div className="label">E-mail</div><input type="email" className="input-field" value={form.email} onChange={e=>setForm({...form,email:e.target.value})} /></div>
                <div>
                  <div className="label">Senha</div>
                  <div className="relative">
                    <input type={mostrarSenha?'text':'password'} className="input-field pr-12" value={form.senha} onChange={e=>setForm({...form,senha:e.target.value})} />
                    <button type="button" onClick={()=>setMostrarSenha(!mostrarSenha)} className="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 text-lg" tabIndex={-1}>{mostrarSenha ? '🙈' : '👁️'}</button>
                  </div>
                </div>
                {erro && <div className="text-xs text-red-600">{erro}</div>}
                {msg && <div className="text-xs text-green-700">{msg}</div>}
                <button type="submit" disabled={carregando} className="btn-primary w-full py-3 rounded-xl font-semibold">{carregando ? 'Entrando...' : 'Entrar'}</button>
                <div className="text-center"><button type="button" onClick={()=>{setModo('reset');setErro('');setMsg('');setResetEtapa(1);}} className="text-xs text-gray-500 underline">Esqueci minha senha</button></div>
              </form>
              <p className="text-center text-xs text-gray-500 mt-5 cursor-pointer" onClick={()=>{setModo('register');setErro('');setMsg('');}}>Não tenho conta — quero cadastrar meu pet</p>
            </>
          )}
          {modo === 'register' && (
            <>
              <h1 className="text-xl font-bold mb-1">Criar conta</h1>
              <p className="text-xs text-gray-500 mb-5">Preencha para começar.</p>
              <form onSubmit={submitLogin} className="space-y-3">
                <div><div className="label">Nome completo</div><input className="input-field" value={form.nome} onChange={e=>setForm({...form,nome:e.target.value})} /></div>
                <div><div className="label">E-mail</div><input type="email" className="input-field" value={form.email} onChange={e=>setForm({...form,email:e.target.value})} /></div>
                <div>
                  <div className="label">Senha</div>
                  <div className="relative">
                    <input type={mostrarSenha?'text':'password'} className="input-field pr-12" value={form.senha} onChange={e=>setForm({...form,senha:e.target.value})} />
                    <button type="button" onClick={()=>setMostrarSenha(!mostrarSenha)} className="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 text-lg" tabIndex={-1}>{mostrarSenha ? '🙈' : '👁️'}</button>
                  </div>
                </div>
                <div>
                  <div className="label">PIN de 4 dígitos (opcional)</div>
                  <input type="tel" inputMode="numeric" maxLength="4" className="input-field" placeholder="Ex: 1234" value={form.pin} onChange={e=>setForm({...form,pin:e.target.value.replace(/\D/g,'').slice(0,4)})} />
                  <p className="text-[10px] text-gray-500 mt-1">Com PIN, você entra rapidinho depois sem digitar senha.</p>
                </div>
                {erro && <div className="text-xs text-red-600">{erro}</div>}
                <button type="submit" disabled={carregando} className="btn-primary w-full py-3 rounded-xl font-semibold">{carregando ? 'Criando...' : 'Criar conta'}</button>
              </form>
              <p className="text-center text-xs text-gray-500 mt-5 cursor-pointer" onClick={()=>{setModo('login');setErro('');}}>Já tenho conta — quero entrar</p>
            </>
          )}
          {modo === 'reset' && (
            <>
              <h1 className="text-xl font-bold mb-1">Redefinir senha</h1>
              <p className="text-xs text-gray-500 mb-5">Digite seu e-mail cadastrado.</p>
              {resetEtapa === 1 && (
                <div className="space-y-3">
                  <div><div className="label">E-mail</div><input type="email" className="input-field" value={resetEmail} onChange={e=>setResetEmail(e.target.value)} /></div>
                  {erro && <div className="text-xs text-red-600">{erro}</div>}
                  <button onClick={iniciarReset} className="btn-primary w-full py-3 rounded-xl font-semibold">Continuar</button>
                  <p className="text-center text-xs text-gray-500 mt-3 cursor-pointer underline" onClick={voltarAoLogin}>Voltar ao login</p>
                </div>
              )}
              {resetEtapa === 2 && (
                <div className="space-y-3">
                  {msg && <div className="text-xs text-green-700 bg-green-100 p-2 rounded-lg">{msg}</div>}
                  <div>
                    <div className="label">Nova senha</div>
                    <div className="relative">
                      <input type={mostrarNovaSenha?'text':'password'} className="input-field pr-12" value={novaSenha} onChange={e=>setNovaSenha(e.target.value)} placeholder="Mínimo 4 caracteres" />
                      <button type="button" onClick={()=>setMostrarNovaSenha(!mostrarNovaSenha)} className="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 text-lg" tabIndex={-1}>{mostrarNovaSenha ? '🙈' : '👁️'}</button>
                    </div>
                  </div>
                  {erro && <div className="text-xs text-red-600">{erro}</div>}
                  <button onClick={confirmarNovaSenha} className="btn-primary w-full py-3 rounded-xl font-semibold">Salvar nova senha</button>
                </div>
              )}
              {resetEtapa === 3 && (
                <div className="space-y-3">
                  {msg && <div className="text-xs text-green-700 bg-green-100 p-3 rounded-lg text-center">{msg}</div>}
                  <button onClick={voltarAoLogin} className="btn-primary w-full py-3 rounded-xl font-semibold">Ir para o login</button>
                </div>
              )}
            </>
          )}
        </div>
      </div>
    </div>
  );
};

const PinScreen = ({ user, onUnlock, onUsarSenha }) => {
  const [pin, setPin] = useState(['','','','']);
  const [erro, setErro] = useState('');
  const [tentativas, setTentativas] = useState(0);
  const inputsRef = [useRef(), useRef(), useRef(), useRef()];

  useEffect(() => { setTimeout(()=>inputsRef[0].current && inputsRef[0].current.focus(), 100); }, []);

  const handleChange = (idx, val) => {
    const v = val.replace(/\D/g,'').slice(-1);
    const novo = [...pin];
    novo[idx] = v;
    setPin(novo);
    if (v && idx < 3) inputsRef[idx+1].current && inputsRef[idx+1].current.focus();
    if (novo.every(x => x !== '')) validar(novo.join(''));
  };

  const handleKeyDown = (idx, e) => {
    if (e.key === 'Backspace' && !pin[idx] && idx > 0) inputsRef[idx-1].current && inputsRef[idx-1].current.focus();
  };

  const validar = (codigo) => {
    if (codigo === user.pin) { onUnlock(); }
    else {
      const t = tentativas + 1;
      setTentativas(t);
      setErro(t >= 3 ? 'PIN incorreto. Use a senha completa.' : 'PIN incorreto. Tente novamente.');
      setPin(['','','','']);
      setTimeout(()=>inputsRef[0].current && inputsRef[0].current.focus(), 100);
    }
  };

  return (
    <div className="min-h-screen flex items-center justify-center p-4" style={{backgroundColor:'#faf6ec'}}>
      <div className="w-full max-w-sm text-center">
        <div className="w-16 h-16 rounded-full flex items-center justify-center text-white text-3xl mx-auto mb-4" style={{backgroundColor:'#eab308'}}>🐾</div>
        <div className="font-bold text-lg mb-1">RG Pet</div>
        <div className="text-sm text-gray-600 mb-1">Olá, {user.nome.split(' ')[0]}</div>
        <div className="text-xs text-gray-500 mb-6">Digite seu PIN de 4 dígitos</div>
        <div className="flex justify-center gap-3 mb-4">
          {[0,1,2,3].map(i => (
            <input key={i} ref={inputsRef[i]} type="tel" inputMode="numeric" maxLength="1" className={`pin-input ${pin[i] ? 'filled' : ''}`} value={pin[i]} onChange={e => handleChange(i, e.target.value)} onKeyDown={e => handleKeyDown(i, e)} />
          ))}
        </div>
        {erro && <div className="text-xs text-red-600 mb-3">{erro}</div>}
        <button onClick={onUsarSenha} className="text-xs text-gray-500 underline">Usar senha completa</button>
      </div>
    </div>
  );
};

    </div>
  );
  return (
    <div className="documento-container">
      {pet.is_lost && (
        <div className="text-center py-3 px-4 mb-4 rounded-lg" style={{backgroundColor:'#dc2626', color:'white'}}>
          <div className="font-bold text-base tracking-wider">⚠ ESTE PET ESTÁ PERDIDO</div>
          <div className="text-[11px] mt-1" style={{color:'#fee2e2'}}>Se você o encontrou, entre em contato com o tutor imediatamente</div>
        </div>
      )}
      <div className="text-center mb-4">
        <div className="w-12 h-12 rounded-full border-2 flex items-center justify-center mx-auto mb-3" style={{borderColor:'#c9b98a', backgroundColor:'#faf6e9'}}><span style={{fontSize:'20px'}}>🐾</span></div>
        <div className="text-[10px] tracking-[0.25em] mb-1 font-bold" style={{color:'#8b7a4d'}}>CÃO LEOTTA CERTIFICA</div>
        <div className="serif text-2xl font-bold" style={{color:'#0a0a0a', lineHeight:'1.15'}}>REGISTRO GERAL PET</div>
      </div>
      <div className="flex gap-4 mb-4 items-center">
        <div className="w-32 h-32 rounded-xl overflow-hidden bg-gray-100 flex-shrink-0" style={{border:'2px solid #c9b98a'}}>
          {pet.foto ? <img src={pet.foto} style={{width:'100%',height:'100%',objectFit:'cover'}} /> : <div className="flex items-center justify-center" style={{width:'100%',height:'100%',fontSize:'42px',color:'#d1d5db'}}>🐾</div>}
        </div>
        <div className="flex-1 min-w-0">
          <div className="text-[10px] tracking-[0.2em] font-bold mb-1" style={{color:'#8b7a4d'}}>NOME DO PET</div>
          <div className="font-extrabold text-xl leading-tight mb-2" style={{color:'#0a0a0a'}}>{pet.nome}</div>
          <div className="text-[10px] tracking-[0.2em] font-bold mb-0.5" style={{color:'#8b7a4d'}}>TUTOR</div>
          <div className="font-bold text-sm" style={{color:'#0a0a0a'}}>{tutor.nome}</div>
        </div>
      </div>
      <div className="space-y-2">
        <div className="grid grid-cols-2 gap-2"><Campo label="Espécie" valor={pet.especie || 'Cão'} /><Campo label="Raça" valor={pet.raca} /></div>
        <div className="grid grid-cols-2 gap-2"><Campo label="Sexo" valor={pet.sexo} /><Campo label="Porte" valor={pet.porte} /></div>
        <div className="grid grid-cols-2 gap-2"><Campo label="Peso" valor={pet.peso} /><Campo label="Castrado" valor={pet.castrado || 'Não'} /></div>
        <div className="grid grid-cols-2 gap-2"><Campo label="Cor / Pelagem" valor={pet.cor_pelagem} /><Campo label="Idade" valor={pet.idade} /></div>
        {pet.tem_microchip && pet.microchip && (<div className="documento-field"><div className="documento-field-label">Microchip</div><div className="documento-field-value" style={{letterSpacing:'1px'}}>{pet.microchip}</div></div>)}
        <div className="documento-field"><div className="documento-field-label">Nº de Registro</div><div className="documento-field-value">{pet.registro_id || 'CL-'+String(pet.id).slice(-6)}</div></div>
        <div className="documento-field"><div className="documento-field-label">Endereço</div><div className="documento-field-value">{[tutor.endereco, tutor.cidade, tutor.uf, tutor.cep].filter(Boolean).join(', ') || '—'}</div></div>
      </div>
      <div className="text-center mt-6 pt-4" style={{borderTop:'1px solid #d9cba3'}}>
        <div className="serif font-bold text-base" style={{color:'#0a0a0a'}}>Cão Leotta</div>
        <div className="text-[10px] italic" style={{color:'#8b7a4d'}}>Registro digital do seu melhor amigo</div>
      </div>
    </div>
  );
};

const CarteiraVacinas = ({ pet }) => {

        <div className="text-xs text-gray-500 mb-3">Nenhuma vacina registrada.</div>

        <div className="space-y-2 mb-3">
          {vacinas.map(v => {
            const s = calcularStatusVacina(v.data);

                  <div className="font-semibold" style={{color:'#1a3c2e'}}>{v.nome}</div>
                  <div className="text-gray-500">Aplicada em: {new Date(v.data).toLocaleDateString('pt-BR')}</div>

        <div className="text-[10px] tracking-[0.2em] font-bold mb-2" style={{color:'#8b7a4d'}}>INFORMAÇÕES DE SAÚDE</div>
        <div className="space-y-1 text-xs">
          <div><span className="text-gray-500">Doenças:</span> {saude.doencas||'—'}</div>
          <div><span className="text-gray-500">Alergias:</span> {saude.alergias||'—'}</div>
          <div><span className="text-gray-500">Medicamentos:</span> {saude.medicamentos||'—'}</div>
          <div><span className="text-gray-500">Tipo sanguíneo:</span> {saude.tipoSanguineo||'—'}</div>
          <div><span className="text-gray-500">Comportamento:</span> {saude.comportamento||'—'}</div>
          {saude.observacoes && <div><span className="text-gray-500">Obs:</span> {saude.observacoes}</div>}

      {(emerg.nome || emerg.telefone) && (

          <div className="text-[10px] tracking-[0.2em] font-bold mb-1" style={{color:'#fee2e2'}}>⚠ CONTATO DE EMERGÊNCIA</div>
          <div className="text-xs font-semibold">{emerg.nome} {emerg.relacao && `(${emerg.relacao})`}</div>
          <div className="text-xs mt-0.5">{emerg.telefone}</div>
        </div>
      )}
    </div>
  );
};

  const dataNasc = pet.data_nascimento ? new Date(pet.data_nascimento + 'T12:00:00').toLocaleDateString('pt-BR') : (pet.idade || '—');
  const Campo = ({ label, valor }) => (
    <div className="documento-field">
      <div className="documento-field-label">{label}</div>
      <div className="documento-field-value">{valor || '—'}</div>
    </div>
  );
  return (
    <div className="documento-container">
      <div className="text-center mb-4">
        <div className="w-12 h-12 rounded-full border-2 flex items-center justify-center mx-auto mb-3" style={{borderColor:'#c9b98a', backgroundColor:'#faf6e9'}}><span style={{fontSize:'20px'}}>🐾</span></div>
        <div className="text-[10px] tracking-[0.25em] mb-1 font-bold" style={{color:'#8b7a4d'}}>CÃO LEOTTA CERTIFICA</div>
        <div className="serif text-2xl font-bold" style={{color:'#0a0a0a', lineHeight:'1.15'}}>CERTIDÃO DE<br/>NASCIMENTO PET</div>
        <p className="text-xs mt-3 px-2 font-medium" style={{color:'#1a1a1a', lineHeight:'1.5'}}>Fica registrado neste documento digital o nascimento e a identidade de <strong>{pet.nome}</strong>, sob o número <strong>{pet.registro_id || 'CL-'+String(pet.id).slice(-6)}</strong>.</p>
      </div>
      <div className="mt-4">
        <Campo label="Nome do pet" valor={pet.nome} />
        <Campo label="Espécie" valor={pet.especie || 'Cão'} />
        <Campo label="Raça" valor={pet.raca} />
        <Campo label="Sexo" valor={pet.sexo} />
        <Campo label="Data de nascimento" valor={dataNasc} />
        <Campo label="Local de nascimento" valor={pet.local_nascimento} />
        <Campo label="Cor / Pelagem" valor={pet.cor_pelagem} />
        <Campo label="Número de registro" valor={pet.registro_id || 'CL-'+String(pet.id).slice(-6)} />
        <Campo label="Pai" valor={pet.pai} />
        <Campo label="Mãe" valor={pet.mae} />
        <Campo label="Tutor / Responsável" valor={tutor.nome} />

      </div>
      {historia && (
        <div className="mt-5 pt-4" style={{borderTop:'1px solid #d9cba3'}}>
          <div className="flex items-center gap-2 mb-3">
            <span style={{fontSize:'14px'}}>📖</span>
            <div className="text-[11px] tracking-[0.15em] font-bold" style={{color:'#8b7a4d'}}>SOBRE A RAÇA — {pet.raca?.toUpperCase()}</div>
          </div>
          <p className="text-xs font-medium" style={{color:'#1a1a1a', lineHeight:'1.65', textAlign:'justify'}}>{historia}</p>
        </div>
      )}
      <div className="text-center mt-6 pt-4" style={{borderTop:'1px solid #d9cba3'}}>
        <div className="serif font-bold text-base" style={{color:'#0a0a0a'}}>Cão Leotta</div>
        <div className="text-[10px] italic" style={{color:'#8b7a4d'}}>Registro digital do seu melhor amigo</div>
      </div>
    </div>
  );
};

const PetForm = ({ user, initialPet, onSaved, onCancel }) => {
  const emEdicao = !!initialPet;
  const [form, setForm] = useState(initialPet ? {
    nome: initialPet.nome || '',
    raca: initialPet.raca || '',
    porte: initialPet.porte || '',
    idade: initialPet.idade || '',
    data_nascimento: initialPet.data_nascimento || '',
    foto: initialPet.foto || '',
    sexo: initialPet.sexo || 'Macho',
    castrado: initialPet.castrado || 'Não',
    peso: initialPet.peso || '',
    cor_pelagem: initialPet.cor_pelagem || '',
    local_nascimento: initialPet.local_nascimento || '',
    pai: initialPet.pai || '',
    mae: initialPet.mae || '',
    especie: initialPet.especie || 'Cão',
    microchip: initialPet.microchip || '',
    tem_microchip: initialPet.tem_microchip || false,
    saude: initialPet.saude || { doencas:'', alergias:'', medicamentos:'', tipoSanguineo:'', comportamento:'Dócil', observacoes:'' },
    emergencia: initialPet.emergencia || { nome:'', telefone:'', relacao:'' }
  } : {
    nome:'', raca:'', porte:'', idade:'', data_nascimento:'', foto:'',
    sexo:'Macho', castrado:'Não', peso:'', cor_pelagem:'', local_nascimento:'', pai:'', mae:'', especie:'Cão',
    microchip:'', tem_microchip:false,
    saude: { doencas:'', alergias:'', medicamentos:'', tipoSanguineo:'', comportamento:'Dócil', observacoes:'' },
    emergencia: { nome:'', telefone:'', relacao:'' }
  });
  const [vacinas, setVacinas] = useState(initialPet?.vaccinations || []);
  const [novaVacina, setNovaVacina] = useState({ nome:'', data:'' });
  const [salvando, setSalvando] = useState(false);

  const salvar = async () => {
    if (!form.nome) { alert('Informe o nome do pet'); return; }
    setSalvando(true);

    if (emEdicao) {
      const { data, error } = await sb.from('pets').update({
        nome: form.nome, especie: form.especie, raca: form.raca, porte: form.porte,
        sexo: form.sexo, castrado: form.castrado, peso: form.peso,
        cor_pelagem: form.cor_pelagem, idade: form.idade, data_nascimento: form.data_nascimento,
        local_nascimento: form.local_nascimento, pai: form.pai, mae: form.mae, foto: form.foto,
        tem_microchip: form.tem_microchip, microchip: form.microchip,
        saude: form.saude, emergencia: form.emergencia, vaccinations: vacinas
      }).eq('id', initialPet.id).select().single();
      if (error) { alert('Erro: ' + error.message); setSalvando(false); return; }
      onSaved(data);
    } else {
      const registroId = 'CL-' + String(Date.now()).slice(-6) + '-' + Math.floor(Math.random()*900+100);
      const pet = {
        id: Date.now(),
        tutor_id: user.id,
        public_id: 'pet_' + Math.random().toString(36).slice(2,8),
        registro_id: registroId,
        data_registro: new Date().toISOString(),
        nome: form.nome, especie: form.especie, raca: form.raca, porte: form.porte,
        sexo: form.sexo, castrado: form.castrado, peso: form.peso,
        cor_pelagem: form.cor_pelagem, idade: form.idade, data_nascimento: form.data_nascimento,
        local_nascimento: form.local_nascimento, pai: form.pai, mae: form.mae, foto: form.foto,
        tem_microchip: form.tem_microchip, microchip: form.microchip,
        saude: form.saude, emergencia: form.emergencia, vaccinations: vacinas, is_lost: false
      };
      const { data, error } = await sb.from('pets').insert([pet]).select().single();
      if (error) { alert('Erro: ' + error.message); setSalvando(false); return; }
      onSaved(data);
    }
  };

  const handleFoto = (e) => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => setForm({...form, foto: ev.target.result});
    reader.readAsDataURL(file);
  };
  const addVacina = () => {
    if (!novaVacina.nome || !novaVacina.data) { alert('Preencha nome e data'); return; }
    setVacinas([...vacinas, { id: Date.now(), ...novaVacina }]);
    setNovaVacina({ nome:'', data:'' });
  };

  return (
    <div className="mobile-container p-4">
      <h1 className="text-xl font-bold mb-4">{emEdicao ? 'Editar pet' : 'Cadastrar novo pet'}</h1>
      <div className="card mb-3 space-y-3">
        <h2 className="font-semibold text-sm">Dados básicos</h2>
        <div>
          <div className="label">Foto do pet</div>
          <div className="flex items-center gap-3">
            <div className="w-20 h-20 rounded-xl overflow-hidden bg-gray-100 flex items-center justify-center flex-shrink-0">
              {form.foto ? <img src={form.foto} style={{width:'100%',height:'100%',objectFit:'cover'}} /> : <span style={{fontSize:'28px',color:'#d1d5db'}}>🐾</span>}
            </div>
            <label className="inline-block px-4 py-2 rounded-xl text-sm font-semibold cursor-pointer text-white" style={{backgroundColor:'#1a3c2e'}}>
              📷 {form.foto ? 'Trocar' : 'Escolher foto'}
              <input type="file" accept="image/*" style={{display:'none'}} onChange={handleFoto} />
            </label>
          </div>
        </div>
        <div><div className="label">Nome do pet</div><input className="input-field" value={form.nome} onChange={e=>setForm({...form,nome:e.target.value})} /></div>
        <div className="grid grid-cols-2 gap-3">
          <div><div className="label">Espécie</div>
            <select className="input-field" value={form.especie} onChange={e=>setForm({...form,especie:e.target.value})}><option>Cão</option><option>Gato</option></select>
          </div>
          <div><div className="label">Raça</div><input className="input-field" placeholder="Bulldog Inglês" value={form.raca} onChange={e=>setForm({...form,raca:e.target.value})} /></div>
        </div>
        <div className="grid grid-cols-2 gap-3">
          <div><div className="label">Porte</div><input className="input-field" placeholder="Médio" value={form.porte} onChange={e=>setForm({...form,porte:e.target.value})} /></div>
          <div><div className="label">Sexo</div>
            <select className="input-field" value={form.sexo} onChange={e=>setForm({...form,sexo:e.target.value})}><option>Macho</option><option>Fêmea</option></select>
          </div>
        </div>
        <div className="grid grid-cols-2 gap-3">
          <div><div className="label">Castrado</div>
            <select className="input-field" value={form.castrado} onChange={e=>setForm({...form,castrado:e.target.value})}><option>Não</option><option>Sim</option></select>
          </div>
          <div><div className="label">Peso estimado</div><input className="input-field" placeholder="Ex: 25 kg" value={form.peso} onChange={e=>setForm({...form,peso:e.target.value})} /></div>
        </div>
        <div><div className="label">Cor / Pelagem</div><input className="input-field" placeholder="Ex: Tricolor" value={form.cor_pelagem} onChange={e=>setForm({...form,cor_pelagem:e.target.value})} /></div>
        <div className="grid grid-cols-2 gap-3">
          <div><div className="label">Idade</div><input className="input-field" placeholder="14 anos" value={form.idade} onChange={e=>setForm({...form,idade:e.target.value})} /></div>
          <div><div className="label">Nascimento</div><input type="date" className="input-field" value={form.data_nascimento} onChange={e=>setForm({...form,data_nascimento:e.target.value})} /></div>
        </div>
        <div><div className="label">Local de nascimento</div><input className="input-field" placeholder="Cidade / Estado" value={form.local_nascimento} onChange={e=>setForm({...form,local_nascimento:e.target.value})} /></div>
        <div className="grid grid-cols-2 gap-3">
          <div><div className="label">Pai (opcional)</div><input className="input-field" value={form.pai} onChange={e=>setForm({...form,pai:e.target.value})} /></div>
          <div><div className="label">Mãe (opcional)</div><input className="input-field" value={form.mae} onChange={e=>setForm({...form,mae:e.target.value})} /></div>
        </div>
        <div className="flex items-center gap-2">
          <input type="checkbox" id="chk-chip" checked={form.tem_microchip} onChange={e=>setForm({...form, tem_microchip:e.target.checked})} />
          <label htmlFor="chk-chip" className="text-sm">Este pet possui microchip</label>
        </div>
        {form.tem_microchip && <div><div className="label">Número do microchip</div><input className="input-field" value={form.microchip} onChange={e=>setForm({...form,microchip:e.target.value})} /></div>}
      </div>

      <div className="card mb-3 space-y-3">
        <h2 className="font-semibold text-sm">Carteira de Vacinação</h2>
        <p className="text-xs text-gray-500">Adicione as vacinas já aplicadas.</p>
        {vacinas.length > 0 && (
          <div className="space-y-2">
            {vacinas.map(v => {
              const s = calcularStatusVacina(v.data);
              return (
                <div key={v.id} className="flex items-center justify-between border rounded-lg p-2">
                  <div className="flex items-center gap-2">
                    <span className="w-2 h-2 rounded-full" style={{backgroundColor:s.pillText}}></span>
                    <div>
                      <div className="text-xs font-semibold">{v.nome}</div>
                      <div className="text-xs text-gray-500">Aplicada em: {new Date(v.data).toLocaleDateString('pt-BR')}</div>
                    </div>
                  </div>
                  <button onClick={()=>setVacinas(vacinas.filter(x=>x.id!==v.id))} className="text-red-500 text-xs">Remover</button>
                </div>
              );
            })}
          </div>
        )}
        <div className="border-t pt-3 space-y-2">
          <div><div className="label">Nome da vacina</div><input className="input-field" placeholder="V10, Antirrábica..." value={novaVacina.nome} onChange={e=>setNovaVacina({...novaVacina, nome:e.target.value})} /></div>
          <div><div className="label">Data de aplicação</div><input type="date" className="input-field" value={novaVacina.data} onChange={e=>setNovaVacina({...novaVacina, data:e.target.value})} /></div>
          <button onClick={addVacina} className="btn-primary w-full py-2 rounded-xl text-sm font-semibold">+ Adicionar vacina</button>
        </div>
      </div>

      <div className="card mb-3 space-y-3">
        <h2 className="font-semibold text-sm">Saúde e comportamento</h2>
        <div><div className="label">Doenças ou condições</div><textarea className="input-field" rows="2" value={form.saude.doencas} onChange={e=>setForm({...form,saude:{...form.saude,doencas:e.target.value}})} /></div>
        <div><div className="label">Alergias</div><textarea className="input-field" rows="2" value={form.saude.alergias} onChange={e=>setForm({...form,saude:{...form.saude,alergias:e.target.value}})} /></div>
        <div><div className="label">Medicamentos contínuos</div><input className="input-field" value={form.saude.medicamentos} onChange={e=>setForm({...form,saude:{...form.saude,medicamentos:e.target.value}})} /></div>
        <div className="grid grid-cols-2 gap-3">
          <div><div className="label">Tipo sanguíneo</div><input className="input-field" value={form.saude.tipoSanguineo} onChange={e=>setForm({...form,saude:{...form.saude,tipoSanguineo:e.target.value}})} /></div>
          <div><div className="label">Comportamento</div>
            <select className="input-field" value={form.saude.comportamento} onChange={e=>setForm({...form,saude:{...form.saude,comportamento:e.target.value}})}>
              <option>Dócil</option><option>Agitado</option><option>Medroso</option>
              <option>Agressivo com estranhos</option><option>Não se aproximar sem cuidado</option>
            </select>
          </div>
        </div>
        <div><div className="label">Observações gerais</div><textarea className="input-field" rows="2" value={form.saude.observacoes} onChange={e=>setForm({...form,saude:{...form.saude,observacoes:e.target.value}})} /></div>
      </div>

      <div className="card mb-3 space-y-3">
        <h2 className="font-semibold text-sm">Contato de emergência</h2>
        <p className="text-xs text-gray-500">Pessoa de confiança para ser acionada caso você não atenda.</p>
        <div className="grid grid-cols-2 gap-3">
          <div><div className="label">Nome</div><input className="input-field" value={form.emergencia.nome} onChange={e=>setForm({...form,emergencia:{...form.emergencia,nome:e.target.value}})} /></div>
          <div><div className="label">Relação</div><input className="input-field" placeholder="Mãe, vizinho..." value={form.emergencia.relacao} onChange={e=>setForm({...form,emergencia:{...form.emergencia,relacao:e.target.value}})} /></div>
        </div>
        <div><div className="label">Telefone / WhatsApp</div><input className="input-field" value={form.emergencia.telefone} onChange={e=>setForm({...form,emergencia:{...form.emergencia,telefone:e.target.value}})} /></div>
      </div>

      <div className="flex gap-2 mb-6">
        <button onClick={salvar} disabled={salvando} className="btn-primary flex-1 px-6 py-3 rounded-xl font-semibold">{salvando ? 'Salvando...' : (emEdicao ? '💾 Salvar alterações' : '💾 Salvar pet')}</button>
        <button onClick={onCancel} className="px-6 py-3 rounded-xl border border-gray-300">Cancelar</button>
      </div>
    </div>
  );
};

const BloqueioDocumentos = ({ user, pet, orders, coupons, settings, onRefresh }) => {
  const [cupom, setCupom] = useState('');
  const [cupomAplicado, setCupomAplicado] = useState(null);
  const [mostrarCupom, setMostrarCupom] = useState(false);
  const [processando, setProcessando] = useState(false);

  const temCombo1 = orders.some(o => o.pet_id===pet.id && o.tipo==='combo1' && o.status==='pago');
  const pedidosPet = orders.filter(o => o.pet_id === pet.id);

  const aplicarCupom = () => {
    const c = coupons.find(c => c.code.toLowerCase() === cupom.toLowerCase() && c.ativo);
    if (!c) { alert('Cupom inválido'); return; }
    setCupomAplicado(c); alert(`Cupom aplicado: ${c.desconto}% off!`);
  };
  const calcular = (base) => cupomAplicado ? +(base * (1 - cupomAplicado.desconto/100)).toFixed(2) : base;

  const comprar = async () => {
    if (!window.confirm('Você será direcionado ao site do Mercado Pago para concluir o pagamento.\n\nLá você escolhe a forma de pagamento (Pix, cartão ou boleto) e finaliza.\n\nApós o pagamento, você volta pro site automaticamente.\n\nDeseja continuar?')) return;

    setProcessando(true);
    const base = settings.price_combo1;
    const valor = calcular(base);

    if (settings.payment_mode === 'auto') {
      try {
        const resp = await fetch('https://rgpet.vercel.app/api/create-payment', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            titulo: 'RG Pet — Combo 1 (RG + Carteirinha + Certidão)',
            valor: valor,
            petId: pet.id,
            tipo: 'combo1',
            userEmail: user.email
          })
        });
        const data = await resp.json();
        if (data.init_point) {
          window.location.href = data.init_point;
        } else {
          alert('Erro ao gerar pagamento: ' + (data.error || 'desconhecido'));
          setProcessando(false);
        }
      } catch (err) {
        alert('Erro de conexão: ' + err.message);
        setProcessando(false);
      }
    } else {
      const pedido = {
        id: Date.now(), pet_id: pet.id, tutor_id: user.id, tipo: 'combo1',
        valor_base: base, valor, status: 'pendente', metodo: 'manual',
        cupom: cupomAplicado?.code || null
      };
      const { error } = await sb.from('pedidos').insert([pedido]);
      if (error) { alert('Erro: ' + error.message); setProcessando(false); return; }
      alert(`Pedido registrado! Valor: R$ ${valor.toFixed(2)}. Envie o comprovante do Pix no WhatsApp para liberar.`);
      setCupom(''); setCupomAplicado(null); setMostrarCupom(false);
      onRefresh();
      setProcessando(false);
    }
  };

  return (
    <div className="space-y-3">
      <div className="card text-center">
        <div className="text-4xl mb-2">🔒</div>
        <div className="font-bold text-base mb-1" style={{color:'#1a3c2e'}}>Documentos bloqueados</div>
        <div className="text-xs text-gray-600 mb-4">Faça o pagamento para liberar o RG, a carteira de vacinação e a certidão de nascimento do seu pet.</div>

        <div className="p-3 rounded-xl mb-3 text-center" style={{backgroundColor:'#fef3c7', border:'1px solid #fde68a'}}>
          <div className="font-bold text-[11px]" style={{color:'#a16207'}}>⚠ ESTA É UMA PRÉVIA DO MODELO</div>
          <div className="text-[10px] mt-1" style={{color:'#a16207'}}>Os dados abaixo são fictícios. Após o pagamento, os dados reais do seu pet aparecerão.</div>
        </div>
      </div>

      <div className="card">
        <div className="font-semibold text-sm mb-3">Escolha um plano</div>
        <div className="border rounded-lg p-3 flex justify-between items-center mb-2">
          <div className="flex-1 min-w-0">
            <div className="font-semibold text-xs">Combo 1 — RG + Carteirinha + Certidão</div>
            <div className="text-[10px] text-gray-500">Documentos completos do seu pet</div>
          </div>
          <div className="text-right ml-2">
            <div className="font-bold text-sm">R$ {calcular(settings.price_combo1).toFixed(2)}</div>
          </div>
        </div>
        <button onClick={comprar} disabled={processando} className="btn-primary w-full py-3 rounded-xl font-semibold mt-2">
          {processando ? 'Aguarde...' : `💰 Comprar — R$ ${calcular(settings.price_combo1).toFixed(2)}`}
        </button>
        <button onClick={()=>setMostrarCupom(!mostrarCupom)} className="text-xs text-gray-600 underline mt-3 w-full text-center">{mostrarCupom ? 'Fechar cupom' : 'Tenho um cupom'}</button>
        {mostrarCupom && (
          <div className="flex gap-2 mt-2">
            <input className="input-field text-sm" placeholder="Cupom" value={cupom} onChange={e=>setCupom(e.target.value)} />
            <button onClick={aplicarCupom} className="btn-primary px-4 rounded-xl text-sm">Aplicar</button>
          </div>
        )}
        {cupomAplicado && <div className="text-xs text-green-700 mt-2 text-center">Cupom {cupomAplicado.code} ({cupomAplicado.desconto}% off)</div>}
      </div>

      {pedidosPet.length > 0 && (
        <div className="card">
          <div className="font-semibold text-sm mb-2">Seus pedidos</div>
          <div className="space-y-2">
            {pedidosPet.map(p => (
              <div key={p.id} className="flex justify-between items-center py-1 text-xs">
                <div className="font-semibold">{p.tipo === 'combo1' ? 'Combo 1' : 'Combo 2 (QR)'}</div>
                <div className="text-right">
                  <div className="font-bold">R$ {Number(p.valor).toFixed(2)}</div>
                  <div className={p.status==='pago'?'text-green-700':'text-yellow-700'}>{p.status === 'pago' ? '✓ Pago' : '⏳ Pendente'}</div>
                </div>
              </div>
            ))}
          </div>
        </div>
      )}

      <div className="card">
        <div className="text-xs font-bold mb-2" style={{color:'#8b7a4d'}}>PRÉVIA DO MODELO</div>
        <RGDocumento pet={PET_FICTICIO} tutor={TUTOR_FICTICIO} />
      </div>
    </div>
  );
};

      <div className="flex gap-1 mb-3 border-b overflow-x-auto">
        {['pedidos','precos','cupons','pets','usuarios'].map(t => (
          <button key={t} onClick={()=>setAba(t)} className="px-3 py-2 text-xs font-medium whitespace-nowrap" style={aba===t?{borderBottom:'2px solid #1a3c2e', color:'#1a3c2e'}:{color:'#6b7280'}}>{t === 'pedidos' ? 'Pedidos' : t === 'precos' ? 'Preços' : t === 'cupons' ? 'Cupons' : t === 'pets' ? 'Pets' : 'Usuários'}</button>
        ))}
      </div>
      {aba === 'pedidos' && (
        <>
          <div className="card mb-3 flex justify-between items-center">
            <div><div className="font-bold text-sm">Modo de pagamento</div><div className="text-xs text-gray-500">Atual: <strong>{settings.payment_mode === 'auto' ? 'Automático' : 'Manual'}</strong></div></div>
            <button onClick={toggleMode} className="px-4 py-2 rounded-xl text-white font-semibold text-xs" style={{backgroundColor: settings.payment_mode==='auto' ? '#16a34a' : '#ca8a04'}}>→ {settings.payment_mode==='auto'?'Manual':'Auto'}</button>
          </div>

          <div className="flex gap-1 mb-3">
            {[['todos','Todos'],['pagos','Pagos'],['pendentes','Pendentes']].map(([k,label]) => (
              <button key={k} onClick={()=>setFiltroPedidos(k)} className="px-3 py-1.5 rounded-full text-xs font-semibold" style={filtroPedidos===k?{backgroundColor:'#1a3c2e', color:'white'}:{backgroundColor:'#fffefb', color:'#6b7280', border:'1px solid #e8dfc8'}}>{label}</button>
            ))}
          </div>

          <h2 className="font-bold text-sm mb-2">Pedidos ({pedidosFiltrados.length})</h2>
          {pedidosFiltrados.length === 0 ? (
            <div className="card text-xs text-gray-500 text-center">Nenhum pedido.</div>
          ) : (
            <div className="space-y-2">
              {pedidosFiltrados.map(o => {
                const pet = pets.find(p => p.id===o.pet_id);
                const t = tutores.find(t => t.id===o.tutor_id);
                return (
                  <div key={o.id} className="card py-3">
                    <div className="flex justify-between items-start">
                      <div className="flex-1 min-w-0">
                        <div className="font-semibold text-sm">{pet?.nome || '—'}</div>
                        <div className="text-xs text-gray-500">Tutor: {t?.nome || '—'}</div>
                        <div className="text-xs">{o.tipo==='combo1'?'Combo 1':'Combo 2 (QR)'} • R$ {Number(o.valor).toFixed(2)}</div>
                        <div className="text-[10px] mt-1">
                          <span className={o.status==='pago'?'text-green-700':'text-yellow-700'}>
                            {o.status === 'pago' ? '✓ Pago' : '⏳ Pendente'}
                          </span>
                          {o.cupom && <span className="text-gray-400"> • Cupom: {o.cupom}</span>}
                        </div>
                      </div>
                      {o.status === 'pendente' && (
                        <button onClick={()=>aprovarPedido(o.id)} className="btn-primary px-3 py-1.5 rounded-lg text-xs font-semibold ml-2">Aprovar</button>
                      )}
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </>
      )}
      {aba === 'precos' && (
        <div className="card space-y-3">
          <h2 className="font-bold text-sm">Editar preços</h2>
          <div><div className="label">Combo 1 (R$)</div><input type="number" step="0.01" className="input-field" value={precos.c1} onChange={e=>setPrecos({...precos, c1: e.target.value})} /></div>
          <div><div className="label">Combo 2 — QR Code (R$)</div><input type="number" step="0.01" className="input-field" value={precos.c2} onChange={e=>setPrecos({...precos, c2: e.target.value})} /></div>
          <button onClick={salvarPrecos} className="btn-primary w-full py-2 rounded-xl font-semibold text-sm">Salvar preços</button>
        </div>
      )}
      {aba === 'cupons' && (
        <>
          <div className="card mb-3 space-y-3">
            <h2 className="font-bold text-sm">Novo cupom</h2>
            <div><div className="label">Código</div><input className="input-field" value={novoCupom.code} onChange={e=>setNovoCupom({...novoCupom, code: e.target.value.toUpperCase()})} placeholder="TESTE100" /></div>
            <div><div className="label">Desconto (%)</div><input type="number" className="input-field" value={novoCupom.desconto} onChange={e=>setNovoCupom({...novoCupom, desconto: parseInt(e.target.value)||0})} /></div>
            <button onClick={criarCupom} className="btn-primary w-full py-2 rounded-xl font-semibold text-sm">Criar</button>
          </div>
          <div className="space-y-2">
            {coupons.map(c => (
              <div key={c.code} className="card flex justify-between items-center py-2">
                <div><div className="font-semibold text-sm">{c.code}</div><div className="text-xs text-gray-500">{c.desconto}% off</div></div>
                <button onClick={()=>toggleCupom(c.code)} className="px-3 py-1.5 rounded-lg text-xs font-semibold" style={c.ativo?{backgroundColor:'#dcfce7', color:'#15803d'}:{backgroundColor:'#f3f4f6', color:'#6b7280'}}>{c.ativo ? 'Ativo' : 'Inativo'}</button>
              </div>
            ))}
          </div>
        </>
      )}
      {aba === 'pets' && (
        <div className="space-y-2">
          {pets.length === 0 && <div className="card text-xs text-gray-500 text-center">Nenhum pet.</div>}
          {pets.map(pet => {
            const t = tutores.find(x => x.id === pet.tutor_id);
            return (
              <div key={pet.id} className="card py-3">
                <div className="flex justify-between items-center">
                  <div className="flex-1 min-w-0"><div className="font-semibold text-sm">{pet.nome}</div><div className="text-xs text-gray-500 truncate">{t?.nome || '—'}</div></div>
                  <button onClick={()=>toggleLost(pet.id, pet.is_lost)} className="px-3 py-1.5 rounded-lg text-xs font-semibold ml-2 text-white" style={{backgroundColor: pet.is_lost?'#16a34a':'#dc2626'}}>{pet.is_lost ? 'Encontrado' : 'Perdido'}</button>
                </div>
              </div>
            );
          })}
        </div>
      )}
      {aba === 'usuarios' && (
        <div className="space-y-2">
          <p className="text-xs text-gray-500 mb-2">Lista de tutores cadastrados.</p>
          {tutores.length === 0 && <div className="card text-xs text-gray-500 text-center">Nenhum usuário.</div>}
          {tutores.map(t => {
            const petsDoTutor = pets.filter(p => p.tutor_id === t.id);
            return (
              <div key={t.id} className="card py-3">
                <div className="font-semibold text-sm">{t.nome}</div>
                <div className="text-xs text-gray-500 truncate">{t.email}</div>
                <div className="text-[10px] text-gray-400">Senha: {t.senha} • PIN: {t.pin || 'não definido'}</div>
                {petsDoTutor.length > 0 && (
                  <div className="text-xs mt-1 font-semibold" style={{color:'#1a3c2e'}}>🐾 Pets: {petsDoTutor.map(p => p.nome).join(', ')}</div>
                )}
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
};

const App = () => {
  const [user, setUser] = useState(null);
  const [view, setView] = useState('landing');
  const [pets, setPets] = useState([]);
  const [orders, setOrders] = useState([]);
  const [coupons, setCoupons] = useState([]);
  const [settings, setSettings] = useState({ payment_mode: 'auto', price_combo1: 29.90, price_combo2: 10.00 });
  const [petSelecionado, setPetSelecionado] = useState(null);
  const [petEditando, setPetEditando] = useState(null);
  const [tabInicial, setTabInicial] = useState(null);
  const [publicId, setPublicId] = useState(null);
  const [isAdmin, setIsAdmin] = useState(false);
  const [registerMode, setRegisterMode] = useState(false);
  const [needPin, setNeedPin] = useState(false);
  const [pinUser, setPinUser] = useState(null);
  const [verPet, setVerPet] = useState(null);
  const [carregando, setCarregando] = useState(true);
  const [msgPagamento, setMsgPagamento] = useState(null);

  const carregarDados = async () => {
    const { data: petsData } = await sb.from('pets').select('*').order('id', { ascending: false });
    const { data: ordersData } = await sb.from('pedidos').select('*').order('id', { ascending: false });
    const { data: couponsData } = await sb.from('cupons').select('*');
    const { data: configData } = await sb.from('configuracoes').select('*').eq('id', 1).maybeSingle();
    if (petsData) setPets(petsData);
    if (ordersData) setOrders(ordersData);
    if (couponsData) setCoupons(couponsData);
    if (configData) setSettings(configData);
    setCarregando(false);
  };

  useEffect(() => {
    const params = new URLSearchParams(window.location.search);
    const p = params.get('pet');
    const pagamento = params.get('pagamento');
    if (p) setPublicId(p);
    if (params.get('admin') === '1') setIsAdmin(true);
    if (pagamento === 'sucesso') {
      setMsgPagamento({ tipo: 'sucesso', texto: 'Pagamento aprovado! Seus documentos foram liberados.' });
      setTimeout(() => setMsgPagamento(null), 8000);
    } else if (pagamento === 'falha' || pagamento === 'pendente') {
      setMsgPagamento({ tipo: 'aviso', texto: 'O pagamento ainda não foi confirmado. Se você já pagou, aguarde alguns segundos.' });
      setTimeout(() => setMsgPagamento(null), 8000);
    }

    carregarDados();

    const saved = localStorage.getItem('rgpet_sessao');
    if (saved) {
      try {
        const s = JSON.parse(saved);
        sb.from('tutores').select('*').eq('id', s.userId).maybeSingle().then(({ data }) => {
          if (data) {
            if (data.pin) { setNeedPin(true); setPinUser(data); }
            else { setUser(data); setView('dashboard'); }
          }
        });
      } catch {}
    }
  }, []);

  const handleLogin = (u) => {
    setUser(u); setView('dashboard');
    localStorage.setItem('rgpet_sessao', JSON.stringify({ userId: u.id }));
  };

  const handleLogout = () => {
    setUser(null); setPetSelecionado(null); setView('landing'); setNeedPin(false); setVerPet(null); setPetEditando(null);
    localStorage.removeItem('rgpet_sessao');
  };

  const handleUnlockPin = async () => {
    const saved = JSON.parse(localStorage.getItem('rgpet_sessao') || '{}');
    const { data } = await sb.from('tutores').select('*').eq('id', saved.userId).maybeSingle();
    if (data) { setUser(data); setView('dashboard'); setNeedPin(false); setPinUser(null); }
  };

  const handleUsarSenha = () => {
    localStorage.removeItem('rgpet_sessao');
    setNeedPin(false); setUser(null); setPinUser(null); setView('login');
  };

  if (publicId) return <PublicPetView publicId={publicId} />;

  if (needPin && !user && pinUser) return <PinScreen user={pinUser} onUnlock={handleUnlockPin} onUsarSenha={handleUsarSenha} />;

  if (!user) {
    if (view === 'landing') return <LandingPage onLoginClick={()=>{setRegisterMode(false);setView('login');}} onRegisterClick={()=>{setRegisterMode(true);setView('login');}} />;
    return <LoginScreen onLogin={handleLogin} initialRegister={registerMode} onBackToLanding={()=>setView('landing')} />;
  }

  return (
    <div className="min-h-screen" style={{backgroundColor:'#faf6ec'}}>
      <Navbar user={user} currentView={view} onNavigate={setView} onLogout={handleLogout} isAdmin={isAdmin} />

      {msgPagamento && (
        <div className="mobile-container px-4 pt-3">
          <div className="p-3 rounded-xl text-sm font-semibold text-center" style={{backgroundColor: msgPagamento.tipo==='sucesso'?'#dcfce7':'#fef3c7', color: msgPagamento.tipo==='sucesso'?'#15803d':'#a16207'}}>
            {msgPagamento.texto}
          </div>
        </div>
      )}

      {view === 'dashboard' && !petSelecionado && !petEditando && (
        <Dashboard user={user} pets={pets} orders={orders} onOpenPet={setPetSelecionado} onNewPet={()=>setView('newPet')} onVerPet={setVerPet} onEditPet={setPetEditando} carregando={carregando} />
      )}
      {view === 'newPet' && (
        <PetForm user={user} onSaved={(p)=>{ carregarDados(); setPetSelecionado(p); setView('dashboard'); }} onCancel={()=>setView('dashboard')} />
      )}
      {petEditando && (
        <PetForm user={user} initialPet={petEditando} onSaved={(p)=>{ carregarDados(); setPetEditando(null); setView('dashboard'); }} onCancel={()=>setPetEditando(null)} />
      )}
      {view === 'dashboard' && petSelecionado && !petEditando && (
        <PetDetail user={user} pet={pets.find(p=>p.id===petSelecionado.id)||petSelecionado} orders={orders} coupons={coupons} settings={settings} onRefresh={carregarDados} onBack={()=>{setPetSelecionado(null);setTabInicial(null);}} onEdit={()=>setPetEditando(petSelecionado)} initialTab={tabInicial} />
      )}
      {view === 'profile' && <TutorProfile user={user} onUpdate={(u)=>setUser({...user, ...u})} onGerarPrevia={()=>setView('preview')} />}
      {view === 'preview' && <PreviewScreen onBack={()=>setView('profile')} onIrParaPagamento={()=>{setView('dashboard');}} />}
      {view === 'admin' && isAdmin && <AdminPanel user={user} pets={pets} orders={orders} coupons={coupons} settings={settings} onRefresh={carregarDados} />}
      {verPet && <ModoApresentacao pet={pets.find(p=>p.id===verPet.id)||verPet} tutor={user} onClose={()=>setVerPet(null)} />}
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
